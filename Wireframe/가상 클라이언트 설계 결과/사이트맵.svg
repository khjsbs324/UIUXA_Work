      .small { font-size: 12px; }
      .journey { font-size: 14px; font-weight: 700; }
      .line { fill: none; stroke: #78A89B; stroke-width: 2; marker-end: url(#arrow); }
      .line-dashed { fill: none; stroke: #9A7A36; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrowGold); }
      .trunk { fill: none; stroke: #B5C8C2; stroke-width: 2; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
