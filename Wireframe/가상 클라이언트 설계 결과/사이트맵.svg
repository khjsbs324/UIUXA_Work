<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1780" viewBox="0 0 1800 1780" role="img" aria-labelledby="title desc">
  <title id="title">스밈(SEUMIM) 사이트맵</title>
  <desc id="desc">브랜드, 하드웨어, AI 데이터 케어, 오프라인 센터, 혜택 및 회원/예외 영역을 1차부터 3차 깊이로 표현한 사이트맵</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; fill: #173B35; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 16px; fill: #5B6F69; }
      .section { font-size: 17px; font-weight: 800; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-sub { font-size: 12px; fill: #5B6F69; }
