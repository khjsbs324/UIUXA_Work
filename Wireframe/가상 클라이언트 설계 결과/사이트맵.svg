    <rect x="120" y="0" width="20" height="20" rx="5" fill="#EAF5F1" stroke="#78A89B"/><text x="148" y="15" class="small">공통</text>
    <rect x="220" y="0" width="20" height="20" rx="5" fill="#EEF1FF" stroke="#7E8ED1"/><text x="248" y="15" class="small">회원</text>
    <rect x="320" y="0" width="20" height="20" rx="5" fill="#FFF4DE" stroke="#D6A84C" stroke-dasharray="4 3"/><text x="348" y="15" class="small">가정</text>
    <rect x="420" y="0" width="20" height="20" rx="5" fill="#FDECEC" stroke="#D47B7B" stroke-dasharray="4 3"/><text x="448" y="15" class="small">예외</text>
