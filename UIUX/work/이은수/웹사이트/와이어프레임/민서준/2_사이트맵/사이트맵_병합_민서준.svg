<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <rect width="1000" height="450" fill="#f8f9fa" rx="12"/>
  <rect x="350" y="20" width="300" height="50" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="500" y="52" fill="#ffffff" font-family="'Pretendard', sans-serif" font-size="16" font-weight="900" text-anchor="middle">사단(士團) 민서준 최적 병합 사이트맵 IA</text>

  <!-- Level 1 Menu Boxes -->
  <g font-family="'Pretendard', sans-serif" font-size="13" font-weight="800" text-anchor="middle">
    <!-- 1.0 Custom Lab -->
    <line x1="500" y1="70" x2="110" y2="120" stroke="#94a3b8" stroke-width="2"/>
    <rect x="20" y="120" width="180" height="45" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="110" y="148" fill="#ffffff">1.0 Atelier Custom Lab</text>

    <!-- 2.0 3D Engraving -->
    <line x1="500" y1="70" x2="305" y2="120" stroke="#94a3b8" stroke-width="2"/>
    <rect x="215" y="120" width="180" height="45" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="305" y="148" fill="#ffffff">2.0 3D Engraving Atelier</text>

    <!-- 3.0 Herbarium -->
    <line x1="500" y1="70" x2="500" y2="120" stroke="#94a3b8" stroke-width="2"/>
    <rect x="410" y="120" width="180" height="45" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="500" y="148" fill="#ffffff">3.0 Herbarium Archive</text>

    <!-- 4.0 Secret Cipher -->
    <line x1="500" y1="70" x2="695" y2="120" stroke="#94a3b8" stroke-width="2"/>
    <rect x="605" y="120" width="180" height="45" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="695" y="148" fill="#ffffff">4.0 Secret Scent Cipher</text>

    <!-- 5.0 Artisan Showcase -->
    <line x1="500" y1="70" x2="890" y2="120" stroke="#94a3b8" stroke-width="2"/>
    <rect x="800" y="120" width="180" height="45" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <text x="890" y="148" fill="#ffffff">5.0 Artisan Showcase</text>
  </g>

  <!-- Level 2 Sub Menu Boxes -->
  <g font-family="'Pretendard', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#334155">
    <!-- Sub 1 -->
    <line x1="110" y1="165" x2="110" y2="200" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="20" y="200" width="180" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="225">· 3축 피펫 레이어링 캔버스</text>
    <text x="110" y="245">· 오일 농도 계산기</text>
    <text x="110" y="260">· 세이프티 가이드</text>

    <!-- Sub 2 -->
    <line x1="305" y1="165" x2="305" y2="200" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="215" y="200" width="180" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="305" y="225">· 놋쇠 캡 3D 각인 프리뷰</text>
    <text x="305" y="245">· 한지 라벨 텍스트 에디터</text>
    <text x="305" y="260">· 360도 보틀 회전 뷰어</text>

    <!-- Sub 3 -->
    <line x1="500" y1="165" x2="500" y2="200" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="410" y="200" width="180" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="500" y="225">· 24종 자생 원료 삽화 도록</text>
    <text x="500" y="245">· 오대산/지리산 산지 맵</text>
    <text x="500" y="260">· IFRA 비건 인증 열람</text>

    <!-- Sub 4 -->
    <line x1="695" y1="165" x2="695" y2="200" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="605" y="200" width="180" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="695" y="225">· Cipher Hash 레시피 발급</text>
    <text x="695" y="245">· 디지털 첩보 레시피 카드</text>
    <text x="695" y="260">· 원클릭 리필 재주문</text>

    <!-- Sub 5 -->
    <line x1="890" y1="165" x2="890" y2="200" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="800" y="200" width="180" height="70" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="890" y="225">· 1·2·3마패 완제품 보석함</text>
    <text x="890" y="245">· 5종 어사 디스커버리 킷</text>
    <text x="890" y="260">· Quick Cart Drawer</text>
  </g>

  <!-- Bottom Badge -->
  <rect x="300" y="380" width="400" height="35" rx="17" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="500" y="403" fill="#475569" font-family="'Pretendard', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Type 2 (르 라보 / 불리 1803 / 그랑핸드형) 5대 영역 최적 병합 구조</text>
</svg>
