<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">[사단(士團)] 정시우 클라이언트 최적 병합 사이트맵 (IA)</text>
  
  <!-- Root Node -->
  <rect x="330" y="70" width="340" height="55" rx="10" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="500" y="95" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">사단(士團) 놋쇠 마패 향수 &amp; VIP 멤버십 자사몰</text>
  <text x="500" y="115" text-anchor="middle" fill="#fef3c7" font-size="12">정시우 PM (5개 시안 최적 병합)</text>

  <!-- Connectors -->
  <path d="M 500 125 L 500 160" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 110 160 L 890 160" stroke="#64748b" stroke-width="2" fill="none"/>
  
  <path d="M 110 160 L 110 190" stroke="#d97706" stroke-width="2" fill="none"/>
  <path d="M 305 160 L 305 190" stroke="#d97706" stroke-width="2" fill="none"/>
  <path d="M 500 160 L 500 190" stroke="#d97706" stroke-width="2" fill="none"/>
  <path d="M 695 160 L 695 190" stroke="#d97706" stroke-width="2" fill="none"/>
  <path d="M 890 160 L 890 190" stroke="#d97706" stroke-width="2" fill="none"/>

  <!-- GNB 1 -->
  <g transform="translate(20, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">1.0 Brass Vessel 3D</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">1.1 360도 3D 용기 렌더링</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">1.2 훈민정음 각인 뷰어</text>
  </g>

  <!-- GNB 2 -->
  <g transform="translate(215, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">2.0 VIP Membership</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">2.1 1·2·3마패 등급 혜택</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">2.2 VIP 디스커버리 배송</text>
  </g>

  <!-- GNB 3 -->
  <g transform="translate(410, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">3.0 Charm Collection</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">3.1 놋쇠 마패 참 3D 조합</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">3.2 백꾸 룩북 갤러리</text>
  </g>

  <!-- GNB 4 -->
  <g transform="translate(605, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">4.0 Eco Refill Sub</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">4.1 카트리지 정기 구독</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">4.2 공병 반납 회수 바코드</text>
  </g>

  <!-- GNB 5 -->
  <g transform="translate(800, 190)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="url(#nodeGrad)" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="90" y="27" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="bold">5.0 Safety &amp; Heritage</text>

    <path d="M 90 45 L 90 70" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="70" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="91" text-anchor="middle" fill="#94a3b8" font-size="11">5.1 화해 비건 성분표</text>

    <path d="M 90 102 L 90 115" stroke="#475569" stroke-width="1.5" fill="none"/>
    <rect x="10" y="115" width="160" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="90" y="136" text-anchor="middle" fill="#94a3b8" font-size="11">5.2 알레르기 유발 필터</text>
  </g>
</svg>
