<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%">
  <rect width="1440" height="900" fill="#F4F1EA"/>
  
  <!-- Header Title Bar -->
  <rect width="1440" height="70" fill="#2d6a4f"/>
  <text x="30" y="44" font-family="'Pretendard', sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">🔄 SOAPHE 웰니스 서비스 흐름도 (Service Flowchart Diagram)</text>
  <text x="1200" y="44" font-family="'Pretendard', sans-serif" font-size="14" fill="#FFFFFF" opacity="0.9">Happy Path &amp; Exception Flows</text>

  <!-- Flowchart Steps -->
  <!-- Step 01 -->
  <rect x="40" y="140" width="170" height="100" rx="8" fill="#333333"/>
  <text x="55" y="175" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">01. 사용자 진입</text>
  <text x="55" y="200" font-family="'Pretendard', sans-serif" font-size="12" fill="#CCCCCC">URL / 광고 진입</text>
  <text x="55" y="220" font-family="'Pretendard', sans-serif" font-size="11" fill="#AAAAAA">[PAGE-100 랜딩]</text>

  <line x1="210" y1="190" x2="260" y2="190" stroke="#555" stroke-width="3"/>

  <!-- Step 02 -->
  <rect x="260" y="140" width="170" height="100" rx="8" fill="#2d6a4f"/>
  <text x="275" y="175" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">02. 메인 랜딩</text>
  <text x="275" y="200" font-family="'Pretendard', sans-serif" font-size="12" fill="#EEEEEE">3D 조형 모션 뷰</text>
  <text x="275" y="220" font-family="'Pretendard', sans-serif" font-size="11" fill="#DDDDDD">[PAGE-101 히어로]</text>

  <line x1="430" y1="190" x2="480" y2="190" stroke="#555" stroke-width="3"/>

  <!-- Step 03 -->
  <rect x="480" y="140" width="170" height="100" rx="8" fill="#2d6a4f"/>
  <text x="495" y="175" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">03. 트레이/향 탐색</text>
  <text x="495" y="200" font-family="'Pretendard', sans-serif" font-size="12" fill="#EEEEEE">360도 뷰 &amp; 3종 향 필터</text>
  <text x="495" y="220" font-family="'Pretendard', sans-serif" font-size="11" fill="#DDDDDD">[PAGE-120~140]</text>

  <line x1="650" y1="190" x2="700" y2="190" stroke="#555" stroke-width="3"/>

  <!-- Step 04 -->
  <rect x="700" y="140" width="170" height="100" rx="8" fill="#2d6a4f"/>
  <text x="715" y="175" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">04. 사전예약 CTA</text>
  <text x="715" y="200" font-family="'Pretendard', sans-serif" font-size="12" fill="#EEEEEE">폼 위치 스무스 이동</text>
  <text x="715" y="220" font-family="'Pretendard', sans-serif" font-size="11" fill="#DDDDDD">[PAGE-170 폼]</text>

  <line x1="870" y1="190" x2="920" y2="190" stroke="#555" stroke-width="3"/>

  <!-- Step 05 Decision -->
  <polygon points="1020,130 1120,190 1020,250 920,190" fill="#E67E22"/>
  <text x="975" y="195" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">유효성 검사</text>

  <!-- Error Loop -->
  <path d="M 1020 130 C 1020 80, 780 80, 780 140" fill="none" stroke="#E74C3C" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="860" y="90" font-family="'Pretendard', sans-serif" font-size="11" font-weight="bold" fill="#E74C3C">오류: 인라인 경고 문구 표시</text>

  <line x1="1120" y1="190" x2="1190" y2="190" stroke="#27AE60" stroke-width="3"/>

  <!-- Step 06 Complete -->
  <rect x="1190" y="140" width="200" height="100" rx="8" fill="#27AE60"/>
  <text x="1210" y="175" font-family="'Pretendard', sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">05. 예약 완료 모달</text>
  <text x="1210" y="200" font-family="'Pretendard', sans-serif" font-size="12" fill="#EEEEEE">티켓 (SPH-2026-0901)</text>
  <text x="1210" y="220" font-family="'Pretendard', sans-serif" font-size="11" fill="#DDDDDD">[PAGE-200 모달]</text>

  <!-- Flow Matrix Table -->
  <rect x="40" y="280" width="1350" height="570" rx="10" fill="#FFFFFF" stroke="#E0DED8" stroke-width="2"/>
  <text x="70" y="320" font-family="'Pretendard', sans-serif" font-size="18" font-weight="bold" fill="#2d6a4f">📑 단계별 서비스 흐름 명세표 (Flow Step Matrix)</text>
  <line x1="70" y1="335" x2="1360" y2="335" stroke="#EEEEEE" stroke-width="1.5"/>

  <!-- Table Headers -->
  <rect x="70" y="350" width="1290" height="40" fill="#F4F1EA"/>
  <text x="90" y="375" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#333">단계</text>
  <text x="160" y="375" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#333">사용자 행동 (User Action)</text>
  <text x="500" y="375" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#333">시스템 처리 (System Action)</text>
  <text x="920" y="375" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#333">화면 ID</text>
  <text x="1080" y="375" font-family="'Pretendard', sans-serif" font-size="13" font-weight="bold" fill="#333">다음 진입 조건</text>

  <!-- Rows -->
  <text x="90" y="420" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">01</text>
  <text x="160" y="420" font-family="'Pretendard', sans-serif" font-size="12" fill="#333">SOAPHE 메인 URL 접속</text>
  <text x="500" y="420" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">GNB 및 히어로 3D 조형 모션 렌더링</text>
  <text x="920" y="420" font-family="'Pretendard', sans-serif" font-size="12" fill="#2d6a4f">PAGE-100</text>
  <text x="1080" y="420" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">스크롤 이동</text>
  <line x1="70" y1="440" x2="1360" y2="440" stroke="#F0F0F0"/>

  <text x="90" y="470" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">02</text>
  <text x="160" y="470" font-family="'Pretendard', sans-serif" font-size="12" fill="#333">360도 뷰어 호버 및 룩북 스위칭</text>
  <text x="500" y="470" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">오브제 트레이 재질 &amp; 세면대/데스크 연출 화보 교체</text>
  <text x="920" y="470" font-family="'Pretendard', sans-serif" font-size="12" fill="#2d6a4f">PAGE-120/130</text>
  <text x="1080" y="470" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">향 탭 클릭</text>
  <line x1="70" y1="490" x2="1360" y2="490" stroke="#F0F0F0"/>

  <text x="90" y="520" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">03</text>
  <text x="160" y="520" font-family="'Pretendard', sans-serif" font-size="12" fill="#333">`사전예약 30%` CTA 클릭</text>
  <text x="500" y="520" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">PAGE-170 사전예약 폼 위치로 스무스 포커스 이동</text>
  <text x="920" y="520" font-family="'Pretendard', sans-serif" font-size="12" fill="#2d6a4f">PAGE-170</text>
  <text x="1080" y="520" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">폼 작성</text>
  <line x1="70" y1="540" x2="1360" y2="540" stroke="#F0F0F0"/>

  <text x="90" y="570" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">04</text>
  <text x="160" y="570" font-family="'Pretendard', sans-serif" font-size="12" fill="#333">성함/연락처 입력 &amp; 제출 클릭</text>
  <text x="500" y="570" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">필드 유효성 검사 (실패 시 인라인 경고, 성공 시 DB 저장)</text>
  <text x="920" y="570" font-family="'Pretendard', sans-serif" font-size="12" fill="#2d6a4f">PAGE-170</text>
  <text x="1080" y="570" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">검사 성공시 모달 오픈</text>
  <line x1="70" y1="590" x2="1360" y2="590" stroke="#F0F0F0"/>

  <text x="90" y="620" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">05</text>
  <text x="160" y="620" font-family="'Pretendard', sans-serif" font-size="12" fill="#333">완료 모달 확정 및 카톡 알림 클릭</text>
  <text x="500" y="620" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">예약 번호 티켓 발급 및 카톡 선물 알림 연동</text>
  <text x="920" y="620" font-family="'Pretendard', sans-serif" font-size="12" fill="#2d6a4f">PAGE-200</text>
  <text x="1080" y="620" font-family="'Pretendard', sans-serif" font-size="12" fill="#555">확인 닫기 클릭</text>
</svg>