<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f1eb;color:#202421}main{max-width:1120px;margin:auto;padding:28px}.hero{padding:42px 28px;background:#e4e6e1;border-radius:18px;margin-bottom:18px}.section{background:#fff;border:1px solid #d5d2ca;border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #d5d2ca;border-radius:12px;padding:14px;min-height:80px;background:#fafafa}.rail{display:flex;gap:10px;overflow:auto}.rail .card{min-width:170px}.tag{display:inline-block;border:1px solid #aaa;border-radius:999px;padding:4px 9px;font-size:12px}.note{background:#262a27;color:#fff;border-radius:14px;padding:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding:28px 18px}}</style><title>브랜드소개-스토리보드-B-V2</title></head><body><main><section class='hero'><span class='tag'>브랜드소개 ·  · V2</span><h1>생활의 문제에서 출발해 제작과 회수까지의 관점을 설명한다</h1><p><b>흐름:</b> 문제→관점→제작→사용 이후</p></section><section class='section'><h2>Visual Layout</h2><p>문제 제기 → 브랜드 관점 → 제작·검수 → 회수·순환</p></section><section class='section'><h2>브랜드 핵심</h2><div class='grid'><div class='card'>추구하는 방향</div><div class='card'>브랜드 특징</div><div class='card'>제품 원칙</div></div></section><section class='note'>상태·접근성·추적 ID는 병합 전 연결검증에서 확인한다.</section></main></body></html>
