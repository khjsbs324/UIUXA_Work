<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&amp;display=swap');
        
        .title { font-family: 'Noto Serif KR', serif; font-size: 28px; font-weight: 700; fill: #4F603F; }
        .subtitle { font-family: 'Pretendard', sans-serif; font-size: 14px; fill: #686E62; }
        .group-title { font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 700; fill: #4F603F; }
        .node-title { font-family: 'Pretendard', sans-serif; font-size: 14px; font-weight: 700; fill: #25281F; }
        .node-desc { font-family: 'Pretendard', sans-serif; font-size: 12px; fill: #4B5145; }
        .node-id { font-family: monospace; font-size: 11px; font-weight: 700; fill: #71815D; }
        
        .badge-text { font-family: 'Pretendard', sans-serif; font-size: 10px; font-weight: 700; }
        .badge-live { fill: #4F603F; }
        .badge-proto { fill: #2457A7; }
        .badge-info { fill: #8B5A46; }
        
        .card-bg { fill: #FFFCF5; stroke: #D7D3C8; stroke-width: 1.5; rx: 8px; }
        .group-bg { fill: #F4ECE1; stroke: #B8C5A9; stroke-width: 1.5; stroke-dasharray: 4 4; rx: 12px; }
        .hero-bg { fill: #E5EBDD; stroke: #4F603F; stroke-width: 2; rx: 10px; }
        
        .arrow { stroke: #71815D; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    
    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#71815D" />
        </marker>
    </defs>
    
    <!-- Background -->
    <rect width="1600" height="1100" fill="#F7F3E8" />
    
    <!-- Header -->
    <g transform="translate(60, 40)">
        <circle cx="20" cy="20" r="20" fill="#4F603F"/>
        <text x="20" y="26" text-anchor="middle" font-family="'Noto Serif KR', serif" font-size="18" font-weight="700" fill="#F7F3E8">다</text>
        <text x="52" y="24" class="title">DAMORI 다모리 웹사이트 통합 사이트구조맵 (Master Sitemap)</text>
        <text x="52" y="44" class="subtitle">전체 21개 페이지 레이어 정보구조 및 브랜드 트랙별 핵심 동선 시각화 통합본</text>
        
        <!-- Legend -->
        <g transform="translate(1100, 10)">
            <rect x="0" y="0" width="380" height="36" fill="#FFFCF5" stroke="#D7D3C8" rx="6"/>
            <text x="12" y="22" font-size="12" font-weight="700" fill="#25281F">상태 범례:</text>
            
            <rect x="80" y="10" width="50" height="16" fill="#E5EBDD" rx="3"/>
            <text x="105" y="22" text-anchor="middle" class="badge-text badge-live">LIVE</text>
            
            <rect x="140" y="10" width="80" height="16" fill="#E2ECF8" rx="3"/>
            <text x="180" y="22" text-anchor="middle" class="badge-text badge-proto">PROTOTYPE</text>
            
            <rect x="230" y="10" width="70" height="16" fill="#F2E1D8" rx="3"/>
            <text x="265" y="22" text-anchor="middle" class="badge-text badge-info">INFO_ONLY</text>
            
            <rect x="310" y="10" width="60" height="16" fill="#ECE5D5" rx="3"/>
            <text x="340" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#686E62">HUB</text>
        </g>
    </g>

    <!-- Root Home Section -->
    <g transform="translate(650, 120)">
        <rect width="300" height="80" class="hero-bg" />
        <text x="15" y="26" class="node-id">PAGE-001 (Root Landing)</text>
        <rect x="230" y="10" width="55" height="18" fill="#4F603F" rx="3"/>
        <text x="257" y="23" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFCF5">LIVE</text>
        <text x="15" y="50" class="node-title" font-size="16">홈 메인 랜딩페이지</text>
        <text x="15" y="68" class="node-desc">브랜드 첫인상, Analog/Digital 스플릿 뷰 &amp; 맞춤 진단</text>
    </g>

    <!-- Group 1: Brand Layer -->
    <g transform="translate(60, 240)">
        <rect width="460" height="340" class="group-bg" />
        <text x="20" y="32" class="group-title">1. Brand Layer (브랜드 및 진단 계층)</text>
        
        <!-- PAGE-002 -->
        <g transform="translate(20, 50)">
            <rect width="420" height="75" class="card-bg" />
            <text x="15" y="24" class="node-id">PAGE-002</text>
            <rect x="350" y="10" width="55" height="18" fill="#E5EBDD" rx="3"/>
            <text x="377" y="23" text-anchor="middle" class="badge-text badge-live">LIVE</text>
            <text x="15" y="44" class="node-title">기록 방식 찾기 (Wayfinder)</text>
            <text x="15" y="62" class="node-desc">목적·분량·장소·기기 기준 아날로그/디지털 비교</text>
        </g>
        
        <!-- PAGE-003 -->
        <g transform="translate(20, 140)">
            <rect width="420" height="75" class="card-bg" />
            <text x="15" y="24" class="node-id">PAGE-003</text>
            <rect x="330" y="10" width="75" height="18" fill="#E2ECF8" rx="3"/>
            <text x="367" y="23" text-anchor="middle" class="badge-text badge-proto">PROTOTYPE</text>
            <text x="15" y="44" class="node-title">3초 맞춤 추천 (Recommendation)</text>
            <text x="15" y="62" class="node-desc">3가지 퀴즈 질문, 추천 초안, 근거 및 직접 수정</text>
        </g>
        
        <!-- PAGE-020 -->
        <g transform="translate(20, 230)">
            <rect width="420" height="75" class="card-bg" />
            <text x="15" y="24" class="node-id">PAGE-020</text>
            <rect x="330" y="10" width="75" height="18" fill="#F2E1D8" rx="3"/>
            <text x="367" y="23" text-anchor="middle" class="badge-text badge-info">INFO_ONLY</text>
            <text x="15" y="44" class="node-title">브랜드 소개 (Brand Story)</text>
            <text x="15" y="62" class="node-desc">다모리 불변 4대 철학, Brand Layer 구조, 원본 보호 선언</text>
        </g>
    </g>

    <!-- Group 2: Analog Track -->
    <g transform="translate(570, 240)">
        <rect width="460" height="430" class="group-bg" />
        <text x="20" y="32" class="group-title">2. Analog Track (아날로그 촉각 몰입 계층)</text>
        
        <!-- PAGE-004 -->
        <g transform="translate(20, 50)">
            <rect width="420" height="68" class="card-bg" />
            <text x="15" y="22" class="node-id">PAGE-004</text>
            <rect x="330" y="8" width="75" height="16" fill="#F2E1D8" rx="3"/>
            <text x="367" y="20" text-anchor="middle" class="badge-text badge-info">INFO_ONLY</text>
            <text x="15" y="40" class="node-title">아날로그 기록 가이드</text>
            <text x="15" y="56" class="node-desc">손글씨 촉각 몰입, 소장 가치 및 아카이빙</text>
        </g>
        
        <!-- PAGE-005 -->
        <g transform="translate(20, 126)">
            <rect width="420" height="68" class="card-bg" />
            <text x="15" y="22" class="node-id">PAGE-005</text>
            <rect x="330" y="8" width="75" height="16" fill="#E2ECF8" rx="3"/>
            <text x="367" y="20" text-anchor="middle" class="badge-text badge-proto">PROTOTYPE</text>
            <text x="15" y="40" class="node-title">노트·속지 구조 선택</text>
            <text x="15" y="56" class="node-desc">줄/도트/격자/무지 영역 및 분량 비교</text>
        </g>

        <!-- PAGE-006 -->
        <g transform="translate(20, 202)">
            <rect width="420" height="68" class="card-bg" />
            <text x="15" y="22" class="node-id">PAGE-006</text>
            <rect x="330" y="8" width="75" height="16" fill="#F2E1D8" rx="3"/>
            <text x="367" y="20" text-anchor="middle" class="badge-text badge-info">INFO_ONLY</text>
            <text x="15" y="40" class="node-title">장문 아날로그 기록 가이드</text>
            <text x="15" y="56" class="node-desc">장문 쓰기 적합 조건, 180도 펼침 사북제본</text>
        </g>

        <!-- PAGE-007 -->
        <g transform="translate(20, 278)">
            <rect width="420" height="68" class="card-bg" />
            <text x="15" y="22" class="node-id">PAGE-007</text>
            <rect x="330" y="8" width="75" height="16" fill="#F2E1D8" rx="3"/>
            <text x="367" y="20" text-anchor="middle" class="badge-text badge-info">INFO_ONLY</text>
            <text x="15" y="40" class="node-title">제품 조건 비교</text>
            <text x="15" y="56" class="node-desc">크기·종이(100g 콩기름)·제본·리필·휴대성</text>
        </g>

        <!-- PAGE-008 -->
        <g transform="translate(20, 354)">
            <rect width="420" height="68" class="card-bg" />
            <text x="15" y="22" class="node-id">PAGE-008</text>
            <rect x="330" y="8" width="75" height="16" fill="#E2ECF8" rx="3"/>
            <text x="367" y="20" text-anchor="middle" class="badge-text badge-proto">PROTOTYPE</text>
            <text x="15" y="40" class="node-title">제품 상세 스펙 비교</text>
            <text x="15" y="56" class="node-desc">확인된 물성 정보와 직접 확인 항목 비교표</text>
        </g>
    </g>

    <!-- Group 3: Digital Track -->
    <g transform="translate(1080, 240)">
        <rect width="460" height="340" class="group-bg" />
        <text x="20" y="32" class="group-title">3. Digital Track (디지털 편리함 계층)</text>
        
        <!-- PAGE-009 -->
        <g transform="translate(20, 50)">
            <rect width="420" height="65" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-009</text>
            <rect x="350" y="6" width="55" height="16" fill="#E5EBDD" rx="3"/>
            <text x="377" y="18" text-anchor="middle" class="badge-text badge-live">LIVE</text>
            <text x="15" y="38" class="node-title">디지털 기록 가이드</text>
            <text x="15" y="53" class="node-desc">빠른 기록, 타임라인, 오프라인 보존 진입</text>
        </g>
        
        <!-- PAGE-010 -->
        <g transform="translate(20, 122)">
            <rect width="420" height="65" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-010</text>
            <rect x="330" y="6" width="75" height="16" fill="#E2ECF8" rx="3"/>
            <text x="367" y="18" text-anchor="middle" class="badge-text badge-proto">PROTOTYPE</text>
            <text x="15" y="38" class="node-title">빠른 퀵노트 입력 (3초 입력)</text>
            <text x="15" y="53" class="node-desc">사진·한 줄·음성·기분 최소 입력 모듈</text>
        </g>

        <!-- PAGE-011 -->
        <g transform="translate(20, 194)">
            <rect width="420" height="65" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-011</text>
            <rect x="330" y="6" width="75" height="16" fill="#E2ECF8" rx="3"/>
            <text x="367" y="18" text-anchor="middle" class="badge-text badge-proto">PROTOTYPE</text>
            <text x="15" y="38" class="node-title">일정과 시간 흐름 (Timelines)</text>
            <text x="15" y="53" class="node-desc">주간·일간 타임블록 PDF &amp; 시간 통제</text>
        </g>

        <!-- PAGE-012 -->
        <g transform="translate(20, 266)">
            <rect width="420" height="65" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-012</text>
            <rect x="330" y="6" width="75" height="16" fill="#F2E1D8" rx="3"/>
            <text x="367" y="18" text-anchor="middle" class="badge-text badge-info">INFO_ONLY</text>
            <text x="15" y="38" class="node-title">장문·보존 디지털 도구 가이드</text>
            <text x="15" y="53" class="node-desc">오프라인 임시 저장, 내보내기 조건 안내</text>
        </g>
    </g>

    <!-- Group 4: Category Hub (PAGE-021) Center Stage -->
    <g transform="translate(570, 690)">
        <rect width="460" height="95" class="hero-bg" stroke="#71815D" />
        <text x="15" y="24" class="node-id">PAGE-021 (Master Solution Hub)</text>
        <rect x="330" y="10" width="75" height="18" fill="#4F603F" rx="3"/>
        <text x="367" y="23" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFCF5">MASTER HUB</text>
        <text x="15" y="48" class="node-title" font-size="17">카테고리 솔루션 허브 (대표 15종 전용)</text>
        <text x="15" y="70" class="node-desc">PROD-001 ~ PROD-015 물성, 규격, 콩기름 종이, 바인더 정밀 필터링 비교</text>
    </g>

    <!-- Group 5: Template & Expression Layer -->
    <g transform="translate(60, 690)">
        <rect width="460" height="260" class="group-bg" />
        <text x="20" y="30" class="group-title">4. Template &amp; Expression Layer</text>
        
        <g transform="translate(20, 45)">
            <rect width="420" height="60" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-013</text>
            <text x="15" y="38" class="node-title">템플릿과 꾸미기 (기능 vs 표현)</text>
            <text x="15" y="52" class="node-desc">템플릿(기능 양식)과 꾸미기 자산(표현) 구분</text>
        </g>
        
        <g transform="translate(20, 112)">
            <rect width="420" height="60" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-014</text>
            <text x="15" y="38" class="node-title">템플릿 탐색·비교 (PDF 양식)</text>
            <text x="15" y="52" class="node-desc">독서, 음악, 감상 아카이빙 템플릿 미리보기</text>
        </g>

        <g transform="translate(20, 179)">
            <rect width="420" height="60" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-015</text>
            <text x="15" y="38" class="node-title">꾸미기 자산 (표지, 스티커, 스탬프)</text>
            <text x="15" y="52" class="node-desc">황동 실링스탬프, 무광 마스킹테이프 표현 자산</text>
        </g>
    </g>

    <!-- Group 6: Guide & Support Layer -->
    <g transform="translate(1080, 690)">
        <rect width="460" height="340" class="group-bg" />
        <text x="20" y="30" class="group-title">5. Guide &amp; Support Layer (시작·복귀·보존)</text>
        
        <g transform="translate(20, 45)">
            <rect width="420" height="65" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-016</text>
            <text x="15" y="38" class="node-title">기록 종합 가이드 (Guide Center)</text>
            <text x="15" y="53" class="node-desc">시작·복귀·보존 도움 지점 맞춤 연결</text>
        </g>

        <g transform="translate(20, 117)">
            <rect width="420" height="65" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-017</text>
            <text x="15" y="38" class="node-title">작게 시작하기 (Small Action)</text>
            <text x="15" y="53" class="node-desc">한 줄·사진·음성 3초 가장 작은 시작 행동</text>
        </g>

        <g transform="translate(20, 189)">
            <rect width="420" height="65" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-018</text>
            <text x="15" y="38" class="node-title">중단 후 다시 시작 (Restart Guide)</text>
            <text x="15" y="53" class="node-desc">멈춘 기록도 죄책감 없이 이어가는 복귀 가이드</text>
        </g>

        <g transform="translate(20, 261)">
            <rect width="420" height="65" class="card-bg" />
            <text x="15" y="20" class="node-id">PAGE-019</text>
            <text x="15" y="38" class="node-title">이동·보존·오프라인 FAQ</text>
            <text x="15" y="53" class="node-desc">임시 저장, 원본 보호 상태 및 자주 묻는 질문</text>
        </g>
    </g>

    <!-- Connectors -->
    <path d="M 650 160 L 520 160 L 520 280" class="arrow" fill="none"/>
    <path d="M 800 200 L 800 240" class="arrow" fill="none"/>
    <path d="M 950 160 L 1080 160 L 1080 240" class="arrow" fill="none"/>
    <path d="M 800 670 L 800 690" class="arrow" fill="none"/>
</svg>
