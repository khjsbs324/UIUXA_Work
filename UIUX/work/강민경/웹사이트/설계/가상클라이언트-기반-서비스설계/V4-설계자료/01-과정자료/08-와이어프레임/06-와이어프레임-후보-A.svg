    <rect x="30" y="870" width="680" height="440" fill="#FFFFFF" stroke="#CCCCCC"/>
    <text x="50" y="910" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#222222">소재 / 180도 평면 제본 / 잉크 번짐 저감 / 실측 치수 대조 정보 영역</text>
    <rect x="50" y="930" width="640" height="360" fill="#EAEAEA"/>
    <text x="210" y="1110" font-family="Arial, sans-serif" font-size="16" fill="#555555">[SPECIFICATION &amp; MATERIAL COMPARISON AREA]</text>

    <!-- SECTION 1.4 User-led Exploration -->
    <rect y="1360" width="740" height="440" fill="#FAFAFA" stroke="#E0E0E0"/>
    <text x="30" y="1390" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 1.4 USER-LED EXPLORATION (AUTONOMY SEARCH)</text>
    <rect x="30" y="1410" width="680" height="360" fill="#EFEFEF"/>
    <text x="200" y="1590" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333">가입 없는 사용자 기준 자율 탐색 정보 영역</text>

    <!-- FOOTER -->
    <rect y="1830" width="740" height="150" fill="#222222"/>
    <text x="30" y="1890" font-family="Arial, sans-serif" font-size="14" fill="#CCCCCC">DAMORI PRODUCTS FOOTER | BRAND PRINCIPLE LINK</text>
  </g>

  <!-- ================= PAGE 3: 2.0 BRAND ================= -->
