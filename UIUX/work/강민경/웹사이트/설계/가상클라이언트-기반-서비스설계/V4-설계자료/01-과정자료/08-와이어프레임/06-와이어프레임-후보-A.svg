    <!-- 15 Product Grid Placeholders (5 rows x 3 cols) -->
    <g transform="translate(30, 1190)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="210" height="90" fill="#D8D8D8"/><text x="60" y="50" font-family="Arial" font-size="12" fill="#333">PRODUCT 01</text>
      <rect x="235" y="0" width="210" height="90" fill="#D8D8D8"/><text x="295" y="50" font-family="Arial" font-size="12" fill="#333">PRODUCT 02</text>
      <rect x="470" y="0" width="210" height="90" fill="#D8D8D8"/><text x="530" y="50" font-family="Arial" font-size="12" fill="#333">PRODUCT 03</text>
      <!-- Row 2 -->
      <rect x="0" y="105" width="210" height="90" fill="#D8D8D8"/><text x="60" y="155" font-family="Arial" font-size="12" fill="#333">PRODUCT 04</text>
      <rect x="235" y="105" width="210" height="90" fill="#D8D8D8"/><text x="295" y="155" font-family="Arial" font-size="12" fill="#333">PRODUCT 05</text>
      <rect x="470" y="105" width="210" height="90" fill="#D8D8D8"/><text x="530" y="155" font-family="Arial" font-size="12" fill="#333">PRODUCT 06</text>
      <!-- Row 3 -->
      <rect x="0" y="210" width="210" height="90" fill="#D8D8D8"/><text x="60" y="260" font-family="Arial" font-size="12" fill="#333">PRODUCT 07</text>
      <rect x="235" y="210" width="210" height="90" fill="#D8D8D8"/><text x="295" y="260" font-family="Arial" font-size="12" fill="#333">PRODUCT 08</text>
      <rect x="470" y="210" width="210" height="90" fill="#D8D8D8"/><text x="530" y="260" font-family="Arial" font-size="12" fill="#333">PRODUCT 09</text>
      <!-- Row 4 -->
      <rect x="0" y="315" width="210" height="90" fill="#D8D8D8"/><text x="60" y="365" font-family="Arial" font-size="12" fill="#333">PRODUCT 10</text>
      <rect x="235" y="315" width="210" height="90" fill="#D8D8D8"/><text x="295" y="365" font-family="Arial" font-size="12" fill="#333">PRODUCT 11</text>
      <rect x="470" y="315" width="210" height="90" fill="#D8D8D8"/><text x="530" y="365" font-family="Arial" font-size="12" fill="#333">PRODUCT 12</text>
      <!-- Row 5 -->
      <rect x="0" y="420" width="210" height="90" fill="#D8D8D8"/><text x="60" y="470" font-family="Arial" font-size="12" fill="#333">PRODUCT 13</text>
      <rect x="235" y="420" width="210" height="90" fill="#D8D8D8"/><text x="295" y="470" font-family="Arial" font-size="12" fill="#333">PRODUCT 14</text>
      <rect x="470" y="420" width="210" height="90" fill="#D8D8D8"/><text x="530" y="470" font-family="Arial" font-size="12" fill="#333">PRODUCT 15</text>
