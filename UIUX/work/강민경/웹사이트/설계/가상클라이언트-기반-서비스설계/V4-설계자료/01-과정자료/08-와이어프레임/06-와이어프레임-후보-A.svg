    <text x="30" y="1870" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#888888">SECTION 0.6 NAVIGATION &amp; FOOTER</text>
    <text x="30" y="1910" font-family="Arial, sans-serif" font-size="14" fill="#CCCCCC">DAMORI BRAND INFO | TERMS | COPYRIGHT &#169; DAMORI</text>
