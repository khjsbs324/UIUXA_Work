<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 2200" width="2400" height="2200">
  <!-- BOARD BACKGROUND -->
  <rect width="2400" height="2200" fill="#F4F4F4"/>
  
  <!-- BOARD HEADER -->
  <rect width="2400" height="100" fill="#222222"/>
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF">DAMORI V4 WIREFRAME BOARD - CANDIDATE A</text>
  <text x="900" y="60" font-family="Arial, sans-serif" font-size="20" fill="#CCCCCC">CONCEPT: EDITORIAL BRAND NARRATIVE (GRAYSCALE ONLY)</text>
  
  <!-- ================= PAGE 1: 0.0 HOME / MAIN ================= -->
  <g transform="translate(40, 140)">
    <!-- CANVAS FRAME -->
    <rect width="740" height="1980" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="2"/>
    
    <!-- PAGE HEADER -->
    <rect width="740" height="50" fill="#333333"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">PAGE 0.0 HOME / MAIN (Long Scroll Landing)</text>
    
    <!-- GNB -->
