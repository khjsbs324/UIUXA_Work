    <text x="30" y="87" font-family="Arial, sans-serif" font-size="16" fill="#444444">[LOGO / HOME]</text>
    <text x="500" y="87" font-family="Arial, sans-serif" font-size="16" fill="#444444">PRODUCTS</text>
    <text x="630" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111">BRAND</text>

    <!-- SECTION 2.1 DAMORI Introduction -->
    <rect y="120" width="740" height="240" fill="#F0F0F0" stroke="#CCCCCC"/>
    <text x="30" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 2.1 DAMORI INTRODUCTION</text>
    <text x="180" y="240" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">DAMORI: 쉼표를 담는 브랜드의 시작</text>

    <!-- SECTION 2.2 Brand Existence & Purpose -->
    <rect y="380" width="740" height="260" fill="#FAFAFA" stroke="#E0E0E0"/>
    <text x="30" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 2.2 BRAND EXISTENCE &amp; PURPOSE</text>
    <text x="210" y="510" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222">&quot;바쁜 일상 속 기록의 쉼표를 전합니다&quot;</text>

    <!-- SECTION 2.3 Recording Philosophy -->
    <rect y="660" width="740" height="320" fill="#EFEFEF" stroke="#CCCCCC"/>
    <text x="30" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 2.3 RECORDING PHILOSOPHY</text>
    <rect x="30" y="710" width="680" height="240" fill="#E0E0E0"/>
    <text x="170" y="820" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#111111">&quot;기록은 의무가 아닌 쉼표입니다&quot; (죄책감 차단 철학)</text>

    <!-- SECTION 2.4 Core Values & User Value -->
    <rect y="1000" width="740" height="260" fill="#FAFAFA" stroke="#E0E0E0"/>
    <text x="30" y="1030" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 2.4 CORE VALUES &amp; USER VALUE</text>
    <text x="180" y="1130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333">Zero Strain | Data Integrity | Autonomy 3대 상위 가치</text>

    <!-- SECTION 2.5 Analog & Digital Principle -->
    <rect y="1280" width="740" height="240" fill="#F4F4F4" stroke="#CCCCCC"/>
    <text x="30" y="1310" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 2.5 ANALOG &amp; DIGITAL PRINCIPLE</text>
    <text x="200" y="1400" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333">아날로그 물성과 디지털 편의성의 보완 관계</text>

    <!-- SECTION 2.6 Product Principle -->
    <rect y="1540" width="740" height="280" fill="#EAEAEA" stroke="#CCCCCC"/>
    <text x="30" y="1570" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 2.6 PRODUCT PRINCIPLE</text>
    <rect x="30" y="1590" width="680" height="200" fill="#FFFFFF" stroke="#CCCCCC"/>
    <text x="210" y="1690" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222">도구를 과시하지 않는 DAMORI 제품 제작 원칙</text>

    <!-- FOOTER -->
    <rect y="1830" width="740" height="150" fill="#222222"/>
    <text x="30" y="1890" font-family="Arial, sans-serif" font-size="14" fill="#CCCCCC">DAMORI BRAND FOOTER | PRODUCTS LINK</text>
