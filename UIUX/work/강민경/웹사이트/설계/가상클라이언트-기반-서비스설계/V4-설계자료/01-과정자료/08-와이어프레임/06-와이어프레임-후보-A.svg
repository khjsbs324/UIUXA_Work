    <text x="180" y="800" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#222222">저부담 회고 / 글 보존 / 편안한 복귀 경험 가이드</text>
    <text x="240" y="830" font-family="Arial, sans-serif" font-size="14" fill="#555555">[RECORDING EXPERIENCE PREVIEW AREA]</text>

