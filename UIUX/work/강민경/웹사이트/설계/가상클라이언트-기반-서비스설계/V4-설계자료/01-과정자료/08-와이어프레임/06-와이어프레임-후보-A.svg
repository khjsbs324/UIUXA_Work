    <!-- GNB -->
    <rect y="50" width="740" height="60" fill="#EAEAEA" stroke="#DDDDDD"/>
    <text x="30" y="87" font-family="Arial, sans-serif" font-size="16" fill="#444444">[LOGO / HOME]</text>
    <text x="500" y="87" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111111">PRODUCTS</text>
    <text x="630" y="87" font-family="Arial, sans-serif" font-size="16" fill="#444444">BRAND</text>

    <!-- SECTION 1.1 Visual Hero -->
