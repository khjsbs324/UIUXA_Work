    <text x="30" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 1.2 PRODUCT GROUP EXPLORATION (~200 RAW POOL)</text>
    <rect x="30" y="430" width="320" height="160" fill="#E5E5E5"/><text x="100" y="515" font-family="Arial" font-size="16" fill="#333">ANALOG GROUP</text>
    <rect x="390" y="430" width="320" height="160" fill="#E5E5E5"/><text x="460" y="515" font-family="Arial" font-size="16" fill="#333">DIGITAL GROUP</text>
    <rect x="30" y="610" width="320" height="160" fill="#E5E5E5"/><text x="90" y="695" font-family="Arial" font-size="16" fill="#333">HYBRID GROUP A</text>
    <rect x="390" y="610" width="320" height="160" fill="#E5E5E5"/><text x="450" y="695" font-family="Arial" font-size="16" fill="#333">HYBRID GROUP B</text>

    <!-- SECTION 1.3 Product Feature & Specification -->
