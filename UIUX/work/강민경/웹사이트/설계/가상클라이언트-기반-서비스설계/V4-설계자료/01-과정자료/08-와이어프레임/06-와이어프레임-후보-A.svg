    <text x="30" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 0.1 FIRST IMPRESSION (EDITORIAL NARRATIVE HERO)</text>
    <rect x="30" y="170" width="680" height="240" fill="#D0D0D0" stroke="#BBBBBB"/>
    <text x="230" y="280" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#222222">DAMORI: 일상 속 기록의 쉼표</text>
    <text x="250" y="310" font-family="Arial, sans-serif" font-size="16" fill="#555555">[BRAND NARRATIVE HERO PLACEHOLDER]</text>

    <!-- SECTION 0.2 Brand Core Summary -->
    <rect y="450" width="740" height="200" fill="#FAFAFA" stroke="#E0E0E0"/>
    <text x="30" y="480" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 0.2 BRAND CORE SUMMARY</text>
    <rect x="40" y="500" width="200" height="120" fill="#EAEAEA"/>
    <text x="70" y="565" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333">사색의 깊이</text>
    <rect x="270" y="500" width="200" height="120" fill="#EAEAEA"/>
    <text x="310" y="565" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333">글 원본 보존성</text>
    <rect x="500" y="500" width="200" height="120" fill="#EAEAEA"/>
    <text x="545" y="565" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333">자율성 가치</text>

    <!-- SECTION 0.3 Recording Experience -->
    <rect y="660" width="740" height="280" fill="#F0F0F0" stroke="#D0D0D0"/>
    <text x="30" y="690" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#666666">SECTION 0.3 RECORDING EXPERIENCE</text>
