    <text x="500" y="87" font-family="Arial, sans-serif" font-size="16" fill="#444444">PRODUCTS</text>
    <text x="630" y="87" font-family="Arial, sans-serif" font-size="16" fill="#444444">BRAND</text>

    <!-- SECTION 0.1 First Impression -->
