<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs><style>.t{font-family:"Malgun Gothic",Arial,sans-serif;fill:#181818}.h{font-size:28px;font-weight:700}.p{font-size:17px;font-weight:700}.s{font-size:13px}.box{fill:#fff;stroke:#333;stroke-width:2}.soft{fill:#f2f2f2;stroke:#777}.line{stroke:#555;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <rect width="1500" height="1040" fill="#fafafa"/><text class="t h" x="55" y="55">DAMORI 사이트 흐름도 · 목적과 이동 결과</text>
  <g class="t"><rect class="box" x="520" y="80" width="460" height="82" rx="8"/><text class="p" x="750" y="112" text-anchor="middle">메인 0.1에서 출발</text><text class="s" x="750" y="139" text-anchor="middle">브랜드 이해 또는 제품 정보 탐색을 선택</text></g>
  <path class="line" d="M650 162V205H290V240"/><path class="line" d="M850 162V205H1210V240"/>
  <g class="t"><rect class="soft" x="80" y="240" width="420" height="110"/><text class="p" x="105" y="275">브랜드와 기록 경험을 먼저 이해</text><text class="s" x="105" y="304">이동: 0.2 핵심 소개 → 0.3 기록 경험</text><text class="s" x="105" y="329">확인: 세 가치와 자신의 기록 방식 연결</text>
  <rect class="soft" x="80" y="405" width="420" height="110"/><text class="p" x="105" y="440">기록 방식과 제품 관계 확인</text><text class="s" x="105" y="469">이동: 0.4 → 0.5 제품 15개</text><text class="s" x="105" y="494">확인: 매체 관계와 후보의 다양성</text></g>
  <path class="line" d="M290 350V405"/><path class="line" d="M500 460H620"/>
  <g class="t"><rect class="soft" x="1000" y="240" width="420" height="110"/><text class="p" x="1025" y="275">제품 정보를 먼저 탐색</text><text class="s" x="1025" y="304">이동: 1.1 시각적 소개 → 1.2 제품군</text><text class="s" x="1025" y="329">확인: 페이지 역할과 임시 정보 범위</text>
  <rect class="soft" x="1000" y="405" width="420" height="110"/><text class="p" x="1025" y="440">특징·사양과 탐색 기준 확인</text><text class="s" x="1025" y="469">이동: 1.3 → 필요 시 1.4</text><text class="s" x="1025" y="494">확인: 근거 상태와 비교 관점, 자동 결과 없음</text></g>
  <path class="line" d="M1210 350V405"/>
  <g class="t"><rect class="box" x="620" y="405" width="300" height="110" rx="8"/><text class="p" x="770" y="440" text-anchor="middle">주요 경로 C</text><text class="s" x="770" y="468" text-anchor="middle">0.3 → 0.4 → 1.2 → 1.3</text><text class="s" x="770" y="493" text-anchor="middle">이야기에서 정보로 이동</text></g>
  <path class="line" d="M920 460H1000"/><path class="line" d="M290 515V595H750V625"/><path class="line" d="M1210 515V595H750V625"/>
  <g class="t"><rect class="soft" x="540" y="625" width="420" height="120"/><text class="p" x="565" y="660">브랜드 이야기 또는 제품 원칙 연결</text><text class="s" x="565" y="688">도착: 브랜드 2.1~2.6 또는 제품 정보 1.3</text><text class="s" x="565" y="714">다음: 서사 읽기 · 확인 정보 재탐색</text></g>
  <path class="line" d="M750 745V815"/><g class="t"><rect class="box" x="490" y="815" width="520" height="100" rx="8"/><text class="p" x="750" y="851" text-anchor="middle">종료 또는 전역 메뉴로 재탐색</text><text class="s" x="750" y="880" text-anchor="middle">제출·결제 절차 없이 필요한 정보 확인 시 종료</text></g>
  <text class="t s" x="55" y="990">사이트 흐름은 이동 구조이며 시스템 처리·앱 로직·자동 추천을 포함하지 않는다.</text>
</svg>
