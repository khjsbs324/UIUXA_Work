<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3800" viewBox="0 0 1200 3800"><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}.t{font-size:58px;font-weight:bold}.h{font-size:30px;font-weight:bold}.m{font-size:18px}.s{font-size:13px}.box{fill:#fff;stroke:#222;stroke-width:2}.gray{fill:#e5e5e5;stroke:#555}.dark{fill:#222}.w{fill:#fff}</style><rect width="1200" height="3800" fill="#fff"/><rect class="dark" width="1200" height="78"/><text class="w m" x="50" y="48">DAMORI</text><text class="w s" x="880" y="48">HOME　 PRODUCTS　 BRAND</text><text class="s" x="50" y="110">PAGE-00 HOME · FINAL DERIVATION V1 · CONTENT-FIDELITY WIREFRAME</text>
<g transform="translate(0 135)"><rect class="gray" x="50" width="1100" height="520"/><text class="s" x="80" y="42">0.1 FIRST IMPRESSION</text><text class="t" x="80" y="150">바쁜 일상 속</text><text class="t" x="80" y="220">기록의 쉼표</text><text class="m" x="80" y="280">기록을 의무보다 생각과 기억을 잠시 내려놓고</text><text class="m" x="80" y="312">다시 만날 수 있는 경험으로 바라봅니다.</text><rect class="box" x="80" y="375" width="200" height="48"/><text class="s" x="125" y="405">제품 세계 보기</text><rect class="box" x="660" y="65" width="430" height="380"/><text class="m" x="785" y="210">HERO IMAGE PLAN</text><text class="s" x="745" y="250">고요한 책상과 열린 노트</text><text class="s" x="735" y="275">[제품·공간 이미지 선정 필요]</text></g>
<g transform="translate(0 715)"><text class="s" x="50" y="30">0.2 BRAND CORE SUMMARY</text><text class="h" x="50" y="82">기록을 대하는 세 가지 기준</text><g transform="translate(50 120)"><rect class="box" width="340" height="240"/><text class="m" x="25" y="52">사색의 깊이</text><text class="s" x="25" y="82">ZERO STRAIN</text><text class="s" x="25" y="130">기록을 또 하나의 부담이나</text><text class="s" x="25" y="152">의무로 만들지 않습니다.</text><rect class="box" x="380" width="340" height="240"/><text class="m" x="405" y="52">글 원본 보존성</text><text class="s" x="405" y="82">DATA INTEGRITY</text><text class="s" x="405" y="130">남긴 글과 기록의 원래 의미를</text><text class="s" x="405" y="152">존중합니다.</text><rect class="box" x="760" width="340" height="240"/><text class="m" x="785" y="52">자율성</text><text class="s" x="785" y="82">AUTONOMY</text><text class="s" x="785" y="130">정답보다 선택할 수 있는</text><text class="s" x="785" y="152">정보를 제공합니다.</text></g></g>
<g transform="translate(0 1120)"><rect class="gray" x="50" width="500" height="430"/><text class="m" x="170" y="190">RECORDING EXPERIENCE</text><text class="s" x="155" y="225">오늘의 기록 → 축적 → 다시 펼침</text><text class="s" x="185" y="255">[이미지 선정 필요]</text><text class="s" x="620" y="38">0.3 WORKING EXPERIENCE EXAMPLE</text><text class="h" x="620" y="98">부담 없이 남기고,</text><text class="h" x="620" y="140">편안하게 돌아오기</text><text class="m" x="620" y="205">저부담 회고</text><text class="s" x="620" y="230">짧게 시작해도 의미가 이어지는 경험</text><text class="m" x="620" y="280">글 원본 보존</text><text class="s" x="620" y="305">형식보다 남긴 글 자체를 존중</text><text class="m" x="620" y="355">편안한 복귀</text><text class="s" x="620" y="380">멈춘 시간을 실패로 만들지 않는 태도</text></g>
