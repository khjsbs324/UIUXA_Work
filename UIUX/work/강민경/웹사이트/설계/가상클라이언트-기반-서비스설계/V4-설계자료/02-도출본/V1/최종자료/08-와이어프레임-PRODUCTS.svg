<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3000" viewBox="0 0 1200 3000"><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}.t{font-size:52px;font-weight:bold}.h{font-size:30px;font-weight:bold}.m{font-size:18px}.s{font-size:13px}.box{fill:#fff;stroke:#222;stroke-width:2}.gray{fill:#e5e5e5;stroke:#555}.dark{fill:#222}.w{fill:#fff}</style><rect width="1200" height="3000" fill="#fff"/><rect class="dark" width="1200" height="78"/><text class="w m" x="50" y="48">DAMORI</text><text class="w s" x="880" y="48">HOME　 PRODUCTS　 BRAND</text><text class="s" x="50" y="110">PAGE-01 PRODUCTS · FINAL DERIVATION V1 · CONTENT-FIDELITY WIREFRAME</text>
<g transform="translate(0 135)"><rect class="gray" x="50" width="1100" height="530"/><text class="s" x="80" y="42">1.1 VISUAL HERO</text><text class="t" x="80" y="145">DAMORI PRODUCTS</text><text class="t" x="80" y="205">PORTFOLIO</text><text class="m" x="80" y="270">제품 세계 → Working Group → 확인 정보 → 탐색 기준</text><text class="s" x="80" y="315">구매보다 제품의 방향과 정보를 이해하는 Category/Sub Page</text><rect class="box" x="680" y="65" width="410" height="390"/><text class="m" x="790" y="220">PRODUCT WORLD HERO</text><text class="s" x="745" y="255">노트·리필·플래너·보관 도구의 장면</text><text class="s" x="800" y="282">[이미지 선정 필요]</text></g>
<g transform="translate(0 730)"><text class="s" x="50" y="30">1.2 WORKING PRODUCT GROUP EXPLORATION</text><text class="h" x="50" y="78">제품 세계를 이해하기 위한 임시 정보 그룹</text><text class="s" x="50" y="110">공식 Category 수·이름 아님 · Product 선정 후 확정</text><g transform="translate(50 145)" class="s"><rect class="box" width="340" height="190"/><text class="m" x="25" y="52">GROUP 01 · 쓰는 도구</text><text x="25" y="95">장문·짧은 기록 등 작성 경험</text><text x="25" y="145">[대표 이미지 선정 필요]</text><rect class="box" x="380" width="340" height="190"/><text class="m" x="405" y="52">GROUP 02 · 계획하는 서식</text><text x="405" y="95">시간축·구획의 사용 맥락</text><text x="405" y="145">[대표 이미지 선정 필요]</text><rect class="box" x="760" width="340" height="190"/><text class="m" x="785" y="52">GROUP 03 · 바꾸어 쓰는 구성</text><text x="785" y="95">리필·내지의 비교 정보</text><text x="785" y="145">[대표 이미지 선정 필요]</text><rect class="box" y="220" width="340" height="190"/><text class="m" x="25" y="272">GROUP 04 · 표현하는 도구</text><text x="25" y="315">꾸미기·인장의 표현 방법</text><text x="25" y="365">[대표 이미지 선정 필요]</text><rect class="box" x="380" y="220" width="340" height="190"/><text class="m" x="405" y="272">GROUP 05 · 보관하는 도구</text><text x="405" y="315">바인더·케이스의 보관 맥락</text><text x="405" y="365">[대표 이미지 선정 필요]</text><rect class="box" x="760" y="220" width="340" height="190"/><text class="m" x="785" y="272">GROUP 06 · 연결하는 구성</text><text x="785" y="315">여러 기록 방식을 함께 보는 정보</text><text x="785" y="365">[대표 이미지 선정 필요]</text></g></g>
<g transform="translate(0 1330)"><rect class="gray" x="50" width="1100" height="760"/><text class="s" x="80" y="42">1.3 PRODUCT FEATURE / SPECIFICATION</text><text class="h" x="80" y="92">확인된 정보와 확인이 필요한 정보</text><text class="s" x="80" y="126">같은 강도로 확정하지 않고 Source 범위를 표시한다.</text><rect class="box" x="80" y="175" width="500" height="480"/><text class="m" x="110" y="220">ANALOG NOTE WORKING CANDIDATES</text><text class="h" x="110" y="290">120gsm</text><text class="s" x="110" y="320">미유광 평산지 후보 기록</text><text class="h" x="110" y="375">180도 펼침</text><text class="h" x="110" y="430">Smyth Sewn 실제본</text><text class="s" x="110" y="490">PROD-001 / PROD-002 등 Analog Note Pool 근거</text><text class="s" x="110" y="525">최종 선정 제품별 적용 여부는 다시 검증</text><rect class="box" x="620" y="175" width="500" height="480"/><text class="m" x="650" y="220">ADDITIONAL INFORMATION STATUS</text><text class="m" x="650" y="285">DIMENSION DATA</text><text class="s" x="650" y="312">[Product Source 추가 검증 필요]</text><text class="m" x="650" y="365">PAGE COUNT / PAPER DETAIL</text><text class="s" x="650" y="392">[Product Source 추가 검증 필요]</text><text class="m" x="650" y="445">WRITING COMPATIBILITY</text><text class="s" x="650" y="472">[확정 성능 문구 사용 금지]</text><text class="m" x="650" y="525">DIGITAL USE</text><text class="s" x="650" y="552">[호환 기능 확정 금지]</text><rect class="box" x="850" y="590" width="230" height="45"/><text class="s" x="900" y="618">브랜드 원칙 보기</text></g>
<g transform="translate(0 2170)"><text class="s" x="50" y="30">1.4 USER-LED EXPLORATION GUIDE · NON-EXECUTABLE</text><text class="h" x="50" y="82">나에게 필요한 정보를 고르는 기준</text><text class="m" x="50" y="130">결과를 계산하지 않고 제품 정보를 읽을 관점을 안내합니다.</text><rect class="gray" x="50" y="180" width="510" height="520"/><text class="m" x="80" y="225">비교 관점 Working Example</text><text class="m" x="80" y="285">기록 목적</text><text class="s" x="80" y="312">오래 쓰기 / 짧게 남기기 / 계획하기</text><text class="m" x="80" y="370">사용 환경</text><text class="s" x="80" y="397">책상 / 이동 / 보관</text><text class="m" x="80" y="455">물성</text><text class="s" x="80" y="482">종이 / 펼침 / 교체 방식</text><text class="m" x="80" y="540">정보 완성도</text><text class="s" x="80" y="567">확인됨 / 추가 검증 필요</text><rect class="gray" x="590" y="180" width="560" height="520"/><text class="m" x="620" y="225">관련 정보 범위</text><text class="m" x="620" y="290">1.2 Working Groups</text><text class="s" x="620" y="320">제품 세계의 범위를 참고</text><text class="m" x="620" y="385">1.3 Evidence / Specification</text><text class="s" x="620" y="415">근거와 미확정 정보를 구분</text><text class="s" x="620" y="500">원하는 정보가 없으면 두 Section을 다시 참고</text><rect class="box" x="620" y="555" width="470" height="70"/><text class="s" x="675" y="595">입력 없음 · 적용 없음 · 자동 결과 없음</text></g><text class="s" x="50" y="2940">CATEGORY_UNCONFIRMED · NEW UNSUPPORTED FACT 0 · FINAL_DERIVATION_V1_FOR_USER_REVIEW</text></svg>
