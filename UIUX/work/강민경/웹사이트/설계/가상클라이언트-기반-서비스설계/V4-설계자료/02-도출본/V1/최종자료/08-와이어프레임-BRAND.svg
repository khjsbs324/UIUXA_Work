<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3500" viewBox="0 0 1200 3500"><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}.t{font-size:62px;font-weight:bold}.h{font-size:30px;font-weight:bold}.m{font-size:18px}.s{font-size:13px}.box{fill:#fff;stroke:#222;stroke-width:2}.gray{fill:#e5e5e5;stroke:#555}.dark{fill:#222}.w{fill:#fff}</style><rect width="1200" height="3500" fill="#fff"/><rect class="dark" width="1200" height="78"/><text class="w m" x="50" y="48">DAMORI</text><text class="w s" x="880" y="48">HOME　 PRODUCTS　 BRAND</text><text class="s" x="50" y="110">PAGE-02 BRAND · FINAL DERIVATION V1 · EDITORIAL WIREFRAME</text>
<g transform="translate(0 135)"><rect class="gray" x="50" width="1100" height="540"/><text class="s" x="80" y="42">2.1 INTRODUCTION</text><text class="t" x="80" y="165">DAMORI</text><text class="h" x="80" y="225">쉼표를 담는 브랜드</text><text class="m" x="80" y="290">기록을 더 많이 하게 만드는 것보다,</text><text class="m" x="80" y="320">기록이 일상에 편안하게 머무는 방법을 생각합니다.</text><text class="s" x="80" y="380">PROJECT WORKING NAME</text><rect class="box" x="700" y="70" width="380" height="390"/><text class="m" x="805" y="225">OPENING VISUAL</text><text class="s" x="780" y="260">기록과 여백을 상징하는 장면</text><text class="s" x="820" y="285">[이미지 선정 필요]</text></g>
<g transform="translate(0 745)"><rect class="gray" x="50" width="480" height="420"/><text class="m" x="145" y="195">EXISTENCE / PURPOSE</text><text class="s" x="150" y="230">바쁜 일상과 잠시 멈춘 기록</text><text class="s" x="190" y="260">[이미지 선정 필요]</text><text class="s" x="620" y="38">2.2 EXISTENCE / PURPOSE</text><text class="h" x="620" y="100">왜 기록의 부담을</text><text class="h" x="620" y="142">덜어내는가</text><text class="m" x="620" y="210">기록이 매일 지켜야 할 목표가 되면,</text><text class="m" x="620" y="242">놓친 하루는 쉽게 실패처럼 느껴집니다.</text><text class="m" x="620" y="292">DAMORI는 기록이 삶을 압박하지 않고</text><text class="m" x="620" y="324">생각과 기억을 내려놓는 자리가 되길 바랍니다.</text></g>
<g transform="translate(0 1250)"><text class="s" x="50" y="30">2.3 RECORDING PHILOSOPHY</text><rect class="box" x="50" y="70" width="1100" height="440"/><text class="h" x="175" y="210">기록은 매일 이어가야 하는 의무가 아닌,</text><text class="h" x="270" y="270">일상의 편안한 쉼표입니다.</text><text class="m" x="265" y="345">멈추어도 괜찮고, 다시 돌아왔을 때 이어갈 수 있는 기록.</text><text class="s" x="475" y="410">SOURCE-BASED CENTRAL QUOTE</text></g>
<g transform="translate(0 1830)"><text class="s" x="50" y="30">2.4 CORE VALUES</text><text class="h" x="50" y="80">기록을 설계하는 세 가지 가치</text><g transform="translate(50 120)"><rect class="gray" width="340" height="290"/><text class="h" x="25" y="72">ZERO STRAIN</text><text class="m" x="25" y="130">시작과 지속의 부담을</text><text class="m" x="25" y="160">낮추는 태도</text><rect class="gray" x="380" width="340" height="290"/><text class="h" x="405" y="72">DATA INTEGRITY</text><text class="m" x="405" y="130">기록 원본과 남긴 의미를</text><text class="m" x="405" y="160">존중하는 관점</text><rect class="gray" x="760" width="340" height="290"/><text class="h" x="785" y="72">AUTONOMY</text><text class="m" x="785" y="130">정답보다 선택할 정보를</text><text class="m" x="785" y="160">제공하는 방식</text></g></g>
<g transform="translate(0 2300)"><text class="s" x="50" y="30">2.5 ANALOG / DIGITAL PRINCIPLE</text><text class="h" x="50" y="100">Analog Material</text><text class="h" x="50" y="142">+ Digital Convenience</text><text class="m" x="50" y="210">손으로 쓰는 감각과 실물로 남는 기억,</text><text class="m" x="50" y="242">정리와 활용을 돕는 편의는 서로를 대체하지 않습니다.</text><text class="s" x="50" y="300">App 기능이나 호환 성능을 약속하는 문구가 아님</text><rect class="gray" x="650" width="500" height="390"/><text class="m" x="760" y="180">IMAGE / TEXT ALTERNATION</text><text class="s" x="745" y="220">물성의 가까운 장면과 디지털 맥락</text><text class="s" x="815" y="250">[이미지 선정 필요]</text></g>
<g transform="translate(0 2790)"><text class="s" x="50" y="30">2.6 PRODUCT PRINCIPLE EXAMPLE</text><text class="h" x="50" y="82">제품을 바라보는 원칙의 예시</text><text class="s" x="50" y="115">Brand Source 기반 Working Example · 공식 개수/최종 Copy 미확정</text><g transform="translate(50 155)"><rect class="box" width="340" height="300"/><text class="m" x="25" y="62">사용의 부담을 낮추는가</text><text class="s" x="25" y="115">구조와 정보가 기록을 시작하는</text><text class="s" x="25" y="140">부담을 키우지 않는지 살핍니다.</text><rect class="box" x="380" width="340" height="300"/><text class="m" x="405" y="62">확인 가능한 정보를 주는가</text><text class="s" x="405" y="115">물성·사양·사용 맥락을 근거와</text><text class="s" x="405" y="140">함께 전달할 수 있는지 살핍니다.</text><rect class="box" x="760" width="340" height="300"/><text class="m" x="785" y="62">사용자의 선택을 남기는가</text><text class="s" x="785" y="115">하나의 정답보다 비교 기준과</text><text class="s" x="785" y="140">선택 가능성을 제공합니다.</text></g><rect class="dark" x="50" y="500" width="1100" height="90"/><text class="w m" x="85" y="555">제품 정보로 이동 → PRODUCTS 1.3</text></g><text class="s" x="50" y="3440">BRAND STORY RHYTHM · PROJECT WORKING NAME · FINAL_DERIVATION_V1_FOR_USER_REVIEW</text></svg>
