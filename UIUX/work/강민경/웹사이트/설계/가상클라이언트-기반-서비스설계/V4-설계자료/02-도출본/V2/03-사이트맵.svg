<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <style>.t{font-family:"Malgun Gothic",Arial,sans-serif;fill:#171717}.h{font-size:28px;font-weight:700}.p{font-size:17px;font-weight:700}.s{font-size:14px}.box{fill:#fff;stroke:#333;stroke-width:2}.soft{fill:#f3f3f3;stroke:#777}.line{stroke:#555;stroke-width:2;fill:none}</style>
  <rect width="1400" height="920" fill="#fafafa"/><text class="t h" x="60" y="58">DAMORI 사이트맵 · 3개 페이지 / 16개 구역</text>
  <rect class="box" x="480" y="90" width="440" height="70" rx="8"/><text class="t p" x="700" y="122" text-anchor="middle">전역 메뉴</text><text class="t s" x="700" y="146" text-anchor="middle">메인 · 카테고리 · 브랜드</text>
  <path class="line" d="M700 160V200M245 200H1155M245 200V230M700 200V230M1155 200V230"/>
  <g><rect class="box" x="60" y="230" width="370" height="70" rx="8"/><text class="t p" x="245" y="260" text-anchor="middle">메인 페이지</text><text class="t s" x="245" y="284" text-anchor="middle">HOME · 스크롤형 포트폴리오</text></g>
  <g><rect class="box" x="515" y="230" width="370" height="70" rx="8"/><text class="t p" x="700" y="260" text-anchor="middle">카테고리·서브 페이지</text><text class="t s" x="700" y="284" text-anchor="middle">PRODUCTS · 정보 탐색</text></g>
  <g><rect class="box" x="970" y="230" width="370" height="70" rx="8"/><text class="t p" x="1155" y="260" text-anchor="middle">브랜드 소개 페이지</text><text class="t s" x="1155" y="284" text-anchor="middle">BRAND · 브랜드 이야기</text></g>
  <g class="t s">
    <rect class="soft" x="60" y="330" width="370" height="62"/><text x="80" y="356">0.1 첫인상·메인 비주얼</text><text x="80" y="378">브랜드 성격과 제품 세계의 첫 단서</text>
    <rect class="soft" x="60" y="408" width="370" height="62"/><text x="80" y="434">0.2 브랜드 핵심 소개</text><text x="80" y="456">사색·원본 존중·자율성</text>
    <rect class="soft" x="60" y="486" width="370" height="62"/><text x="80" y="512">0.3 기록 경험</text><text x="80" y="534">낮은 부담·보존·편안한 복귀 예시</text>
    <rect class="soft" x="60" y="564" width="370" height="62"/><text x="80" y="590">0.4 기록 방식과 제품 연결</text><text x="80" y="612">아날로그 물성·디지털 편의</text>
    <rect class="soft" x="60" y="642" width="370" height="62"/><text x="80" y="668">0.5 제품 15개 포트폴리오</text><text x="80" y="690">레이아웃 검토용 제품 후보</text>
    <rect class="soft" x="60" y="720" width="370" height="62"/><text x="80" y="746">0.6 마무리·페이지 이동</text><text x="80" y="768">다음 탐색과 지원 정보</text>
    <rect class="soft" x="515" y="330" width="370" height="78"/><text x="535" y="358">1.1 시각적 제품 소개</text><text x="535" y="382">제품의 사용 맥락과 페이지 역할</text>
    <rect class="soft" x="515" y="424" width="370" height="78"/><text x="535" y="452">1.2 제품군 탐색</text><text x="535" y="476">공식 분류가 아닌 임시 제품군</text>
    <rect class="soft" x="515" y="518" width="370" height="78"/><text x="535" y="546">1.3 제품 특징·사양 정보</text><text x="535" y="570">확인 정보와 추가 확인 항목 구분</text>
    <rect class="soft" x="515" y="612" width="370" height="78"/><text x="535" y="640">1.4 자율 탐색 기준 안내</text><text x="535" y="664">비실행형 비교 관점과 정보 범위</text>
    <rect class="soft" x="970" y="330" width="370" height="62"/><text x="990" y="356">2.1 브랜드 소개</text><text x="990" y="378">프로젝트 브랜드 이야기의 시작</text>
    <rect class="soft" x="970" y="408" width="370" height="62"/><text x="990" y="434">2.2 브랜드 존재 이유</text><text x="990" y="456">기록 부담을 낮추는 목적</text>
    <rect class="soft" x="970" y="486" width="370" height="62"/><text x="990" y="512">2.3 기록 철학</text><text x="990" y="534">의무가 아닌 일상의 쉼표</text>
    <rect class="soft" x="970" y="564" width="370" height="62"/><text x="990" y="590">2.4 핵심 가치</text><text x="990" y="612">부담·원본·자율성의 기준</text>
    <rect class="soft" x="970" y="642" width="370" height="62"/><text x="990" y="668">2.5 아날로그·디지털 원칙</text><text x="990" y="690">매체의 상호 보완 관계</text>
    <rect class="soft" x="970" y="720" width="370" height="62"/><text x="990" y="746">2.6 제품 원칙</text><text x="990" y="768">검토용 원칙 예시</text>
  </g>
  <text class="t s" x="60" y="860">주요 경로 C: 0.3 기록 경험 → 0.4 기록 방식과 제품 → 1.2 제품군 탐색 → 1.3 제품 특징·사양 정보</text>
</svg>
