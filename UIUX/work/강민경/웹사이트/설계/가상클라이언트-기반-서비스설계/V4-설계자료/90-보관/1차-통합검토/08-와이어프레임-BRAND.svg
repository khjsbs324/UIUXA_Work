<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3300" viewBox="0 0 1200 3300"><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}.title{font-size:62px;font-weight:bold}.h{font-size:30px;font-weight:bold}.m{font-size:18px}.s{font-size:13px}.box{fill:#fff;stroke:#222;stroke-width:2}.gray{fill:#e5e5e5;stroke:#555}.dark{fill:#222}.white{fill:#fff}</style><rect width="1200" height="3300" fill="#fff"/><rect class="dark" width="1200" height="78"/><text class="white m" x="55" y="48">DAMORI</text><text class="white s" x="880" y="48">HOME　 PRODUCTS　 BRAND</text><text class="s" x="50" y="110">PAGE-02 BRAND / EDITORIAL WIREFRAME / FIRST REVIEW DRAFT</text>
<g transform="translate(0 130)"><rect class="gray" x="50" width="1100" height="520"/><text class="s" x="80" y="45">SECTION 2.1 · BRAND INTRODUCTION</text><text class="title" x="80" y="175">DAMORI</text><text class="h" x="80" y="235">쉼표를 담는 브랜드</text><text class="s" x="80" y="300">프로젝트 브랜드명 / 최종 공식 명칭 승인 전</text><rect class="box" x="700" y="70" width="380" height="350"/><text class="m" x="805" y="235">OPENING VISUAL</text></g>
<g transform="translate(0 710)"><rect class="gray" x="50" width="470" height="380"/><text class="m" x="150" y="190">EXISTENCE / PURPOSE</text><text class="s" x="610" y="35">SECTION 2.2</text><text class="h" x="610" y="95">왜 기록의 부담을</text><text class="h" x="610" y="140">덜어내는가</text><text class="m" x="610" y="205">바쁜 일상에서 기록이 또 하나의</text><text class="m" x="610" y="240">의무가 되지 않도록 존재 이유와</text><text class="m" x="610" y="275">목적을 설명한다.</text></g>
<g transform="translate(0 1160)"><text class="s" x="50" y="30">SECTION 2.3 · RECORDING PHILOSOPHY</text><rect class="box" x="50" y="70" width="1100" height="400"/><text class="h" x="185" y="210">기록은 매일 이어가야 하는 의무가 아닌,</text><text class="h" x="280" y="270">일상의 편안한 쉼표입니다.</text><text class="s" x="460" y="350">CENTRAL QUOTE / SOURCE CONFIRMED</text></g>
<g transform="translate(0 1690)"><text class="s" x="50" y="30">SECTION 2.4 · CORE VALUES</text><text class="h" x="50" y="80">세 가지 핵심 가치</text><g transform="translate(50 120)"><rect class="gray" width="340" height="260"/><text class="h" x="25" y="70">ZERO STRAIN</text><text class="m" x="25" y="125">부담을 낮추는 태도</text><rect class="gray" x="380" width="340" height="260"/><text class="h" x="405" y="70">DATA INTEGRITY</text><text class="m" x="405" y="125">기록 원본을 존중</text><rect class="gray" x="760" width="340" height="260"/><text class="h" x="785" y="70">AUTONOMY</text><text class="m" x="785" y="125">방식을 강요하지 않는 선택</text></g></g>
<g transform="translate(0 2140)"><text class="s" x="50" y="30">SECTION 2.5 · ANALOG &amp; DIGITAL</text><text class="h" x="50" y="100">Analog Material</text><text class="h" x="50" y="145">+ Digital Convenience</text><text class="m" x="50" y="215">두 기록 매체가 서로의 장점을 보완한다는 브랜드 관점</text><text class="s" x="50" y="260">실제 App 기능 또는 Compatibility 약속이 아님</text><rect class="gray" x="650" width="500" height="360"/><text class="m" x="760" y="170">IMAGE / TEXT ALTERNATION</text><text class="s" x="790" y="205">물성과 편의의 상호 보완</text></g>
<g transform="translate(0 2600)"><text class="s" x="50" y="30">SECTION 2.6 · PRODUCT PRINCIPLE EXAMPLE</text><text class="h" x="50" y="85">제품을 바라보는 원칙의 예시</text><text class="s" x="50" y="120">공식 원칙의 개수나 최종 카피를 확정하지 않는다.</text><g transform="translate(50 160)"><rect class="box" width="340" height="260"/><text class="m" x="25" y="65">PRODUCT PRINCIPLE</text><text class="s" x="25" y="115">SUPPORTING TEXT</text><text class="s" x="25" y="190">[최종 Content 결정 예정]</text><rect class="box" x="380" width="340" height="260"/><text class="m" x="405" y="65">PRODUCT PRINCIPLE</text><text class="s" x="405" y="115">SUPPORTING TEXT</text><text class="s" x="405" y="190">[최종 Content 결정 예정]</text><rect class="box" x="760" width="340" height="260"/><text class="m" x="785" y="65">PRODUCT PRINCIPLE</text><text class="s" x="785" y="115">SUPPORTING TEXT</text><text class="s" x="785" y="190">[최종 Content 결정 예정]</text></g><rect class="dark" x="50" y="480" width="1100" height="90"/><text class="white m" x="85" y="535">제품 정보와 원칙의 맥락 보기 → PRODUCTS 1.3</text></g><text class="s" x="50" y="3240">EDITORIAL RHYTHM · GRAYSCALE · PROJECT WORKING NAME · USER QA PENDING</text></svg>
