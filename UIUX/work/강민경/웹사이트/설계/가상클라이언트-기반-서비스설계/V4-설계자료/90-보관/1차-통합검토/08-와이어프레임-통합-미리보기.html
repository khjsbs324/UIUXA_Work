<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAMORI Wireframe SVG Preview</title><style>body{margin:0;background:#bbb;font-family:Arial,"Malgun Gothic",sans-serif}.bar{position:sticky;top:0;background:#111;color:#fff;padding:14px}.bar button{padding:8px 14px;margin-right:6px}.panel{display:none;max-width:1200px;margin:24px auto;background:#fff}.panel.active{display:block}object{display:block;width:100%;height:85vh}</style></head><body><div class="bar">상세 Wireframe 검토　<button data-id="h">HOME</button><button data-id="p">PRODUCTS</button><button data-id="b">BRAND</button></div><div class="panel active" id="h"><object data="08-와이어프레임-HOME.svg" type="image/svg+xml">HOME SVG</object></div><div class="panel" id="p"><object data="08-와이어프레임-PRODUCTS.svg" type="image/svg+xml">PRODUCTS SVG</object></div><div class="panel" id="b"><object data="08-와이어프레임-BRAND.svg" type="image/svg+xml">BRAND SVG</object></div><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.id).classList.add('active')})</script></body></html>
