<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
  <style>.t{font-family:"Malgun Gothic",Arial,sans-serif;fill:#181818}.h{font-size:28px;font-weight:700}.p{font-size:20px;font-weight:700}.s{font-size:14px}.box{fill:#fff;stroke:#333;stroke-width:2}.soft{fill:#f2f2f2;stroke:#777}.line{stroke:#555;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <rect width="1600" height="1040" fill="#fafafa"/><text class="t h" x="55" y="55">DAMORI 사이트 구조맵 · 메뉴 → 콘텐츠 → 정보 → 행동 → 관계</text>
  <rect class="box" x="520" y="80" width="560" height="72" rx="8"/><text class="t p" x="800" y="110" text-anchor="middle">전역 메뉴</text><text class="t s" x="800" y="136" text-anchor="middle">메인 · 카테고리 · 브랜드 / 세 페이지 상호 이동</text>
  <path class="line" d="M800 152V190H275V220"/><path class="line" d="M800 152V220"/><path class="line" d="M800 152V190H1325V220"/>
  <g class="t"><rect class="box" x="45" y="220" width="460" height="98" rx="8"/><text class="p" x="70" y="252">메인 페이지</text><text class="s" x="70" y="279">목적: 브랜드와 제품 세계를 긴 흐름으로 이해</text><text class="s" x="70" y="302">요구: 낮은 부담의 기록 · 위치 이해 · 제품 다양성</text>
  <rect class="soft" x="45" y="340" width="460" height="205"/><text class="p" x="70" y="374">콘텐츠와 표시 정보</text><text class="s" x="70" y="405">• 프로젝트 브랜드명과 기록의 쉼표</text><text class="s" x="70" y="431">• 세 가치와 세 기록 경험 예시</text><text class="s" x="70" y="457">• 아날로그 물성·디지털 편의의 관계</text><text class="s" x="70" y="483">• Source 기반 작업용 제품 후보 15개</text><text class="s" x="70" y="509">• 다음 탐색과 지원 정보</text>
  <rect class="box" x="45" y="570" width="460" height="130"/><text class="p" x="70" y="604">사용자 행동</text><text class="s" x="70" y="635">스크롤 · 제품 정보 보기 · 브랜드 이야기 이동</text><text class="s" x="70" y="662">연결: 0.3→0.4→1.2→1.3 / 0.5→1.3</text></g>
  <g class="t"><rect class="box" x="570" y="220" width="460" height="98" rx="8"/><text class="p" x="595" y="252">카테고리·서브 페이지</text><text class="s" x="595" y="279">목적: 정보 범위와 비교 관점을 가입 없이 파악</text><text class="s" x="595" y="302">요구: 근거 정보 · 자율 탐색 · 과장 없는 사양</text>
  <rect class="soft" x="570" y="340" width="460" height="205"/><text class="p" x="595" y="374">콘텐츠와 표시 정보</text><text class="s" x="595" y="405">• 제품 사용 맥락을 보여 주는 시각적 소개</text><text class="s" x="595" y="431">• 공식 분류가 아닌 임시 제품군 6개</text><text class="s" x="595" y="457">• 확인 정보와 추가 확인 항목의 분리</text><text class="s" x="595" y="483">• 제한된 후보의 120gsm·180도·Smyth Sewn</text><text class="s" x="595" y="509">• 실행하지 않는 탐색 기준 안내</text>
  <rect class="box" x="570" y="570" width="460" height="130"/><text class="p" x="595" y="604">사용자 행동</text><text class="s" x="595" y="635">제품군 범위 읽기 · 정보 비교 · 기준 참고</text><text class="s" x="595" y="662">연결: 1.2↔1.3↔1.4 / 1.3↔2.6</text></g>
  <g class="t"><rect class="box" x="1095" y="220" width="460" height="98" rx="8"/><text class="p" x="1120" y="252">브랜드 소개 페이지</text><text class="s" x="1120" y="279">목적: 존재 이유와 기록·제품 관점을 서사로 이해</text><text class="s" x="1120" y="302">요구: 철학 · 신뢰 · 선택의 자율성</text>
  <rect class="soft" x="1095" y="340" width="460" height="205"/><text class="p" x="1120" y="374">콘텐츠와 표시 정보</text><text class="s" x="1120" y="405">• 프로젝트 브랜드 소개와 존재 이유</text><text class="s" x="1120" y="431">• 기록은 의무가 아닌 일상의 편안한 쉼표</text><text class="s" x="1120" y="457">• 부담·원본·자율성의 핵심 가치</text><text class="s" x="1120" y="483">• 아날로그·디지털의 상호 보완</text><text class="s" x="1120" y="509">• 공식 개수 미확정인 제품 원칙 예시</text>
  <rect class="box" x="1095" y="570" width="460" height="130"/><text class="p" x="1120" y="604">사용자 행동</text><text class="s" x="1120" y="635">서사 읽기 · 제품 정보 이동</text><text class="s" x="1120" y="662">연결: 2.1→2.6 / 2.6→1.3</text></g>
  <path class="line" d="M505 635H570"/><path class="line" d="M1030 650H1095"/><path class="line" d="M1095 682H1030"/>
  <rect class="soft" x="250" y="780" width="1100" height="170" rx="8"/><text class="t p" x="285" y="820">현재 범위 경계</text><text class="t s" x="285" y="854">실제 행동: 페이지 이동 · 구역 이동 · 제품 정보 확인 · 비교 기준 참고</text><text class="t s" x="285" y="884">현재 기능 아님: 로그인 · 저장 · 동기화 · 편집기 · 자동 추천 · 필터 실행 · 장바구니 · 구매</text><text class="t s" x="285" y="914">미확정: 공식 제품 카테고리 · 최종 제품 15개 · 실제 이미지 · 최종 제품별 사양</text>
</svg>
