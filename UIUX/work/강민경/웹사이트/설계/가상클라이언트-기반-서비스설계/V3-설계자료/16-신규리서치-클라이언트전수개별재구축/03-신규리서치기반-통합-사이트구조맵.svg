<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fcfbf9; }
      .header-bg { fill: #1e2522; rx: 8px; }
      .header-text { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 22px; font-weight: 800; }
      .badge-bg { fill: #4a5d55; rx: 4px; }
      .badge-text { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 700; }
      
      .node-root { fill: #1e2522; stroke: #4a5d55; stroke-width: 3; rx: 10px; }
      .node-gnb { fill: #4a5d55; stroke: #2b302d; stroke-width: 2; rx: 8px; }
      .node-sub { fill: #ffffff; stroke: #e2ddd7; stroke-width: 1.5; rx: 6px; }
      
      .text-root { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 15px; font-weight: 800; }
      .text-gnb { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 13px; font-weight: 700; }
      .text-sub-title { fill: #2b302d; font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 700; }
      .text-sub-id { fill: #5c635f; font-family: 'Pretendard', sans-serif; font-size: 10px; font-weight: 600; }
      
      .line-solid { stroke: #4a5d55; stroke-width: 2; }
      .line-dash { stroke: #9e7b66; stroke-width: 1.5; stroke-dasharray: 4 2; }
    </style>
  </defs>

  <rect width="1600" height="1100" class="bg" />

  <!-- Header -->
  <rect x="50" y="30" width="1500" height="68" class="header-bg" />
  <text x="80" y="72" class="header-text">[LOGO] DAMORI 50개 개별 클라이언트 정의서 연동 사이트구조맵 (IA)</text>
  <rect x="1240" y="48" width="280" height="32" class="badge-bg" />
  <text x="1260" y="69" class="badge-text">50개 개별 MD 파일 100% 연동</text>

  <!-- Root Node -->
  <rect x="650" y="130" width="300" height="68" class="node-root" />
  <text x="800" y="158" text-anchor="middle" class="text-root">SCR-001 / PAGE-001 홈 메인페이지</text>
  <text x="800" y="180" text-anchor="middle" fill="#e2ddd7" font-size="11px" font-family="Pretendard">15~50개 전수 라인업 가로 스크롤 레일 수록</text>

  <!-- Trunk Lines -->
  <path d="M 800 198 L 800 240 M 150 240 L 1450 240" class="line-solid" />
  <path d="M 150 240 L 150 270" class="line-solid" />
  <path d="M 475 240 L 475 270" class="line-solid" />
  <path d="M 800 240 L 800 270" class="line-solid" />
  <path d="M 1125 240 L 1125 270" class="line-solid" />
  <path d="M 1450 240 L 1450 270" class="line-solid" />

  <!-- GNB 1 -->
  <rect x="50" y="270" width="200" height="44" class="node-gnb" />
  <text x="150" y="297" text-anchor="middle" class="text-gnb">GNB 1: PAGE-002 방식찾기</text>
  <path d="M 150 314 L 150 340" class="line-dash" />
  <rect x="50" y="340" width="200" height="44" class="node-sub" />
  <text x="150" y="359" text-anchor="middle" class="text-sub-title">PAGE-003 맞춤 추천 결과</text>
  <text x="150" y="375" text-anchor="middle" class="text-sub-id">VC-08 다온 / VC-23 도윤</text>

  <!-- GNB 2 -->
  <rect x="375" y="270" width="200" height="44" class="node-gnb" />
  <text x="475" y="297" text-anchor="middle" class="text-gnb">GNB 2: PAGE-004 아날로그</text>
  <path d="M 475 314 L 475 340" class="line-dash" />
  <rect x="375" y="340" width="200" height="44" class="node-sub" />
  <text x="475" y="359" text-anchor="middle" class="text-sub-title">PAGE-005 노트 &amp; 내지 선택</text>
  <text x="475" y="375" text-anchor="middle" class="text-sub-id">VC-01 은재 (120gsm 미유광)</text>

  <!-- GNB 3 -->
  <rect x="700" y="270" width="200" height="44" class="node-gnb" />
  <text x="800" y="297" text-anchor="middle" class="text-gnb">GNB 3: PAGE-009 디지털</text>
  <path d="M 800 314 L 800 340" class="line-dash" />
  <rect x="700" y="340" width="200" height="44" class="node-sub" />
  <text x="800" y="359" text-anchor="middle" class="text-sub-title">PAGE-010 10초 빠른 기록</text>
  <text x="800" y="375" text-anchor="middle" class="text-sub-id">VC-03 하람 (4대 빠른 폼)</text>

  <!-- GNB 4 -->
  <rect x="1025" y="270" width="200" height="44" class="node-gnb" />
  <text x="1125" y="297" text-anchor="middle" class="text-gnb">GNB 4: PAGE-013 템플릿</text>
  <path d="M 1125 314 L 1125 340" class="line-dash" />
  <rect x="1025" y="340" width="200" height="44" class="node-sub" />
  <text x="1125" y="359" text-anchor="middle" class="text-sub-title">PAGE-014 사본 템플릿 탐색</text>
  <text x="1125" y="375" text-anchor="middle" class="text-sub-id">VC-04 소담 (원본보호)</text>

  <!-- GNB 5 -->
  <rect x="1350" y="270" width="200" height="44" class="node-gnb" />
  <text x="1450" y="297" text-anchor="middle" class="text-gnb">GNB 5: PAGE-016 가이드</text>
  <path d="M 1450 314 L 1450 340" class="line-dash" />
  <rect x="1350" y="340" width="200" height="44" class="node-sub" />
  <text x="1450" y="359" text-anchor="middle" class="text-sub-title">PAGE-018 중단 후 다시 시작</text>
  <text x="1450" y="375" text-anchor="middle" class="text-sub-id">VC-07 이준 (미안함 해소)</text>

  <!-- Footer -->
  <rect x="50" y="620" width="1500" height="52" fill="#f4f0eb" stroke="#9e7b66" stroke-width="1.5" rx="6px" />
  <text x="800" y="651" text-anchor="middle" fill="#1e2522" font-family="Pretendard" font-size="14px" font-weight="700">전역 푸터: PAGE-019 이동·보존·도움말 (VC-13 여울) | PAGE-020 브랜드 소개 (VC-24/27) | PAGE-001 홈</text>
</svg>
