<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fcfbf9; }
      .header-bg { fill: #1e2522; rx: 8px; }
      .header-text { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 22px; font-weight: 800; }
      .badge-bg { fill: #9e7b66; rx: 4px; }
      .badge-text { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 700; }
      
      .vc-group-bg { fill: #ffffff; stroke: #e2ddd7; stroke-width: 1.5; rx: 10px; }
      .vc-group-header { fill: #4a5d55; rx: 6px; }
      .text-gh { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 13px; font-weight: 800; }
      .text-vc { fill: #2b302d; font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1600" height="1200" class="bg" />

  <!-- Header -->
  <rect x="50" y="30" width="1500" height="68" class="header-bg" />
  <text x="80" y="72" class="header-text">[LOGO] DAMORI 브랜드 50개 가상 클라이언트 전수 매핑 시각 도면 (VC-01 ~ VC-50)</text>
  <rect x="1260" y="48" width="260" height="32" class="badge-bg" />
  <text x="1280" y="69" class="badge-text">50명 클라이언트 100% 반영</text>

  <!-- Group 1: Core 7 VCs -->
  <rect x="50" y="130" width="460" height="480" class="vc-group-bg" />
  <rect x="60" y="140" width="440" height="36" class="vc-group-header" />
  <text x="280" y="163" text-anchor="middle" class="text-gh">1 Tier: 근거 기반 핵심 7인 (VC-01 ~ VC-07)</text>
  
  <text x="75" y="200" class="text-vc">• VC-01 은재 (아날로그 장문) → PAGE-004, 005 (180도 평산지)</text>
  <text x="75" y="230" class="text-vc">• VC-02 지안 (시간축 통제) → PAGE-009, 011 (24시간 타임라인)</text>
  <text x="75" y="260" class="text-vc">• VC-03 하람 (저부담 회고) → PAGE-010, 017 (10초 4대 폼)</text>
  <text x="75" y="290" class="text-vc">• VC-04 소담 (주제별 탐색) → PAGE-013, 014 (원본보호 템플릿)</text>
  <text x="75" y="320" class="text-vc">• VC-05 태오 (다기기 연속성) → PAGE-012, 019 (PDF 내보내기)</text>
  <text x="75" y="350" class="text-vc">• VC-06 나린 (꾸미기 재사용) → PAGE-013, 015 (실링 왁스/스티커)</text>
  <text x="75" y="380" class="text-vc">• VC-07 이준 (중단 후 재시작) → PAGE-016, 018 (미안함 없는 복귀)</text>

  <!-- Group 2: Strategic 8 VCs -->
  <rect x="570" y="130" width="460" height="480" class="vc-group-bg" />
  <rect x="580" y="140" width="440" height="36" class="vc-group-header" />
  <text x="800" y="163" text-anchor="middle" class="text-gh">2 Tier: 전략적 검증 8인 (VC-08 ~ VC-15)</text>

  <text x="595" y="200" class="text-vc">• VC-08 다온 (첫 선택 부담) → PAGE-002 (4대 자율 필터 칩)</text>
  <text x="595" y="230" class="text-vc">• VC-09 윤슬 (속지/제품 비교) → PAGE-008 (잉크 번짐 1대1 비교)</text>
  <text x="595" y="260" class="text-vc">• VC-10 온유 (선물 패키지) → PAGE-007 (황동 인장 패키지)</text>
  <text x="595" y="290" class="text-vc">• VC-11 가람 (브랜드 신뢰) → PAGE-001 (확인된 사실 표기)</text>
  <text x="595" y="320" class="text-vc">• VC-12 해솔 (개인정보 통제) → PAGE-019 (로컬 저장 우선)</text>
  <text x="595" y="350" class="text-vc">• VC-13 여울 (접근성) → PAGE-019 (WCAG 2.1 스크린리더)</text>
  <text x="595" y="380" class="text-vc">• VC-14 마루 (탐색 재개) → PAGE-002 (이전 필터 자동 유지)</text>
  <text x="595" y="410" class="text-vc">• VC-15 새봄 (지속가능성) → PAGE-005 (친환경 종이 출처)</text>

  <!-- Group 3: Scenario 35 VCs -->
  <rect x="1090" y="130" width="460" height="980" class="vc-group-bg" />
  <rect x="1100" y="140" width="440" height="36" class="vc-group-header" />
  <text x="1320" y="163" text-anchor="middle" class="text-gh">3 Tier: 시나리오 검증 35인 (VC-16 ~ VC-50)</text>

  <text x="1115" y="200" class="text-vc">• VC-16 한결 (설정 피로) → PAGE-010 (1클릭 빠른 폼)</text>
  <text x="1115" y="225" class="text-vc">• VC-17 채운 (종이 정보) → PAGE-008 (평산지 수치표)</text>
  <text x="1115" y="250" class="text-vc">• VC-18 서우 (디지털 판단) → PAGE-012 (표준 포맷 백업)</text>
  <text x="1115" y="275" class="text-vc">• VC-19 초아 (공동 기록) → PAGE-019 (개인 사본 분리)</text>
  <text x="1115" y="300" class="text-vc">• VC-20 주원 (방식 전환) → PAGE-002 (아날로그↔디지털)</text>
  <text x="1115" y="325" class="text-vc">• VC-21 민서 (예산 탐색) → PAGE-007 (가격대 3단계)</text>
  <text x="1115" y="350" class="text-vc">• VC-22 선율 (공개 부담) → PAGE-010 (기본 비공개)</text>
  <text x="1115" y="375" class="text-vc">• VC-23 도윤 (필터 회피) → PAGE-002 (원터치 4대 칩)</text>
  <text x="1115" y="400" class="text-vc">• VC-24 아라 (근거 확인) → PAGE-020 (확인 날짜 명시)</text>
  <text x="1115" y="425" class="text-vc">• VC-25 재희 (선물 회피) → PAGE-007 (스타터 패키지)</text>
  <text x="1115" y="450" class="text-vc">• VC-26 지후 (중단 맥락) → PAGE-018 (보류 복귀 기능)</text>
  <text x="1115" y="475" class="text-vc">• VC-27 예린 (주장 검증) → PAGE-020 (체감 vs 문서 사실)</text>
  <text x="1115" y="500" class="text-vc">• VC-28 수현 (과거 기록) → PAGE-011 (타임라인 검색)</text>
  <text x="1115" y="525" class="text-vc">• VC-29 건우 (실물 공간) → PAGE-004 (슬림 바인더)</text>
  <text x="1115" y="550" class="text-vc">• VC-30 서진 (후회 방지) → PAGE-014 (사본 미리보기)</text>
  <text x="1115" y="575" class="text-vc">• VC-31 지민 (알림 피로) → PAGE-011 (기본 알림 끄기)</text>
  <text x="1115" y="600" class="text-vc">• VC-32 유진 (의미 선택) → PAGE-010 (감정 태깅)</text>
  <text x="1115" y="625" class="text-vc">• VC-33 연우 (기록 이전) → PAGE-019 (가져오기 가이드)</text>
  <text x="1115" y="650" class="text-vc">• VC-34 하윤 (선물 접근) → PAGE-017 (바로 시작)</text>
  <text x="1115" y="675" class="text-vc">• VC-35 시온 (방식 수정) → PAGE-002 (추천 수정)</text>
  <text x="1115" y="700" class="text-vc">• VC-36 나윤 (속지 리필) → PAGE-007 (독립 리필 팩)</text>
  <text x="1115" y="725" class="text-vc">• VC-37 태윤 (탐색 구분) → PAGE-001 (가이드 분리)</text>
  <text x="1115" y="750" class="text-vc">• VC-38 라온 (브랜드 가치) → PAGE-001 (다모리 서사)</text>
  <text x="1115" y="775" class="text-vc">• VC-39 은호 (과정 검증) → PAGE-020 (설계 과정 공개)</text>
  <text x="1115" y="800" class="text-vc">• VC-40 세아 (긴 서사) → PAGE-001 (스티키 네비)</text>
  <text x="1115" y="825" class="text-vc">• VC-41 유나 (방향 감각) → PAGE-002 (수평선 비교)</text>
  <text x="1115" y="850" class="text-vc">• VC-45 해나 (한국 정서) → PAGE-020 (불박 도장 각인)</text>
  <text x="1115" y="875" class="text-vc">• VC-46 지율 (스크린리더) → 전역 UI (Skip Link)</text>
  <text x="1115" y="900" class="text-vc">• VC-47 주하 (모바일 레일) → PAGE-001 (터치 카러셀)</text>
  <text x="1115" y="925" class="text-vc">• VC-48 태린 (15개 라인업) → PAGE-001 (전수 상품 레일)</text>
  <text x="1115" y="950" class="text-vc">• VC-49 윤재 (디자인 톤) → 전역 UI (흑백 미니멀)</text>
  <text x="1115" y="975" class="text-vc">• VC-50 아인 (카테고리) → PAGE-013 (구조 vs 표현 분리)</text>
</svg>
