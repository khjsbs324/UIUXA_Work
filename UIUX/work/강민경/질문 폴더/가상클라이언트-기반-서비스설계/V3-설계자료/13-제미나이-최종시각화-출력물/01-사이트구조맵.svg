<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 950" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #fcfbf9; }
      .header-bg { fill: #1e2522; rx: 8px; }
      .header-text { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 20px; font-weight: 800; }
      .badge-bg { fill: #4a5d55; rx: 4px; }
      .badge-text { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: 700; }
      
      .node-root { fill: #1e2522; stroke: #4a5d55; stroke-width: 2.5; rx: 8px; }
      .node-gnb { fill: #4a5d55; stroke: #2b302d; stroke-width: 2; rx: 6px; }
      .node-sub { fill: #ffffff; stroke: #e2ddd7; stroke-width: 1.5; rx: 6px; }
      
      .text-root { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 14px; font-weight: 800; }
      .text-gnb { fill: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 13px; font-weight: 700; }
      .text-sub-title { fill: #2b302d; font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 700; }
      .text-sub-id { fill: #5c635f; font-family: 'Pretendard', sans-serif; font-size: 10px; font-weight: 600; }
      
      .line { stroke: #9e7b66; stroke-width: 1.5; stroke-dasharray: 4 2; }
      .line-solid { stroke: #4a5d55; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="950" class="bg" />

  <!-- Header Banner -->
  <rect x="50" y="30" width="1300" height="64" class="header-bg" />
  <text x="80" y="70" class="header-text">[LOGO] DAMORI (다모리) 50개 가상 클라이언트 통합 사이트구조맵 (IA)</text>
  <rect x="1080" y="48" width="240" height="28" class="badge-bg" />
  <text x="1100" y="66" class="badge-text">VC-01 ~ VC-50 (100% 매핑)</text>

  <!-- Root Node: PAGE-001 Home -->
  <rect x="550" y="130" width="300" height="64" class="node-root" />
  <text x="700" y="156" text-anchor="middle" class="text-root">SCR-001 / PAGE-001 홈 메인페이지</text>
  <text x="700" y="178" text-anchor="middle" fill="#e2ddd7" font-size="11px" font-family="Pretendard">상품 15~50개 전수 가로 스크롤 카드 레일 반영</text>

  <!-- Connection Lines -->
  <path d="M 700 194 L 700 234 M 150 234 L 1250 234" class="line-solid" />
  <path d="M 150 234 L 150 264" class="line-solid" />
  <path d="M 425 234 L 425 264" class="line-solid" />
  <path d="M 700 234 L 700 264" class="line-solid" />
  <path d="M 975 234 L 975 264" class="line-solid" />
  <path d="M 1250 234 L 1250 264" class="line-solid" />

  <!-- GNB 1 -->
  <rect x="50" y="264" width="200" height="48" class="node-gnb" />
  <text x="150" y="292" text-anchor="middle" class="text-gnb">GNB 1: PAGE-002 방식 찾기</text>
  <path d="M 150 312 L 150 344" class="line" />
  <rect x="50" y="344" width="200" height="44" class="node-sub" />
  <text x="150" y="363" text-anchor="middle" class="text-sub-title">PAGE-003 맞춤 추천 결과</text>
  <text x="150" y="379" text-anchor="middle" class="text-sub-id">SCR-003 (VC-08 무설정)</text>

  <!-- GNB 2 -->
  <rect x="325" y="264" width="200" height="48" class="node-gnb" />
  <text x="425" y="292" text-anchor="middle" class="text-gnb">GNB 2: PAGE-004 아날로그</text>
  <path d="M 425 312 L 425 344" class="line" />
  <rect x="325" y="344" width="200" height="44" class="node-sub" />
  <text x="425" y="363" text-anchor="middle" class="text-sub-title">PAGE-005 노트 &amp; 내지 선택</text>
  <text x="425" y="379" text-anchor="middle" class="text-sub-id">SCR-005 (VC-01 평산지)</text>
  <path d="M 425 388 L 425 408" class="line" />
  <rect x="325" y="408" width="200" height="44" class="node-sub" />
  <text x="425" y="427" text-anchor="middle" class="text-sub-title">PAGE-006 장문 수기 가이드</text>
  <text x="425" y="443" text-anchor="middle" class="text-sub-id">SCR-006 (필기 템포)</text>
  <path d="M 425 452 L 425 472" class="line" />
  <rect x="325" y="472" width="200" height="44" class="node-sub" />
  <text x="425" y="491" text-anchor="middle" class="text-sub-title">PAGE-007 아날로그 라인업</text>
  <text x="425" y="507" text-anchor="middle" class="text-sub-id">SCR-007 (황동 인장 키트)</text>
  <path d="M 425 516 L 425 536" class="line" />
  <rect x="325" y="536" width="200" height="44" class="node-sub" />
  <text x="425" y="555" text-anchor="middle" class="text-sub-title">PAGE-008 제품 상세 비교</text>
  <text x="425" y="571" text-anchor="middle" class="text-sub-id">SCR-008 (잉크 번짐 수치)</text>

  <!-- GNB 3 -->
  <rect x="600" y="264" width="200" height="48" class="node-gnb" />
  <text x="700" y="292" text-anchor="middle" class="text-gnb">GNB 3: PAGE-009 디지털</text>
  <path d="M 700 312 L 700 344" class="line" />
  <rect x="600" y="344" width="200" height="44" class="node-sub" />
  <text x="700" y="363" text-anchor="middle" class="text-sub-title">PAGE-010 10초 빠른 기록</text>
  <text x="700" y="379" text-anchor="middle" class="text-sub-id">SCR-010 (VC-03 4대 폼)</text>
  <path d="M 700 388 L 700 408" class="line" />
  <rect x="600" y="408" width="200" height="44" class="node-sub" />
  <text x="700" y="427" text-anchor="middle" class="text-sub-title">PAGE-011 일정 &amp; 시간 흐름</text>
  <text x="700" y="443" text-anchor="middle" class="text-sub-id">SCR-011 (VC-02 HOLD 공지)</text>
  <path d="M 700 452 L 700 472" class="line" />
  <rect x="600" y="472" width="200" height="44" class="node-sub" />
  <text x="700" y="491" text-anchor="middle" class="text-sub-title">PAGE-012 보존 &amp; 백업 도구</text>
  <text x="700" y="507" text-anchor="middle" class="text-sub-id">SCR-012 (VC-05 PDF 백업)</text>

  <!-- GNB 4 -->
  <rect x="875" y="264" width="200" height="48" class="node-gnb" />
  <text x="975" y="292" text-anchor="middle" class="text-gnb">GNB 4: PAGE-013 템플릿/꾸미기</text>
  <path d="M 975 312 L 975 344" class="line" />
  <rect x="875" y="344" width="200" height="44" class="node-sub" />
  <text x="975" y="363" text-anchor="middle" class="text-sub-title">PAGE-014 사본 템플릿 탐색</text>
  <text x="975" y="379" text-anchor="middle" class="text-sub-id">SCR-014 (VC-04 원본보호)</text>
  <path d="M 975 388 L 975 408" class="line" />
  <rect x="875" y="408" width="200" height="44" class="node-sub" />
  <text x="975" y="427" text-anchor="middle" class="text-sub-title">PAGE-015 꾸미기 자산</text>
  <text x="975" y="443" text-anchor="middle" class="text-sub-id">SCR-015 (VC-06 스티커)</text>

  <!-- GNB 5 -->
  <rect x="1150" y="264" width="200" height="48" class="node-gnb" />
  <text x="1250" y="292" text-anchor="middle" class="text-gnb">GNB 5: PAGE-016 기록 가이드</text>
  <path d="M 1250 312 L 1250 344" class="line" />
  <rect x="1150" y="344" width="200" height="44" class="node-sub" />
  <text x="1250" y="363" text-anchor="middle" class="text-sub-title">PAGE-017 작게 시작하기</text>
  <text x="1250" y="379" text-anchor="middle" class="text-sub-id">SCR-017 (VC-08 다온)</text>
  <path d="M 1250 388 L 1250 408" class="line" />
  <rect x="1150" y="408" width="200" height="44" class="node-sub" />
  <text x="1250" y="427" text-anchor="middle" class="text-sub-title">PAGE-018 중단 후 다시 시작</text>
  <text x="1250" y="443" text-anchor="middle" class="text-sub-id">SCR-018 (VC-07 미안함 해소)</text>
  <path d="M 1250 452 L 1250 472" class="line" />
  <rect x="1150" y="472" width="200" height="44" class="node-sub" />
  <text x="1250" y="491" text-anchor="middle" class="text-sub-title">PAGE-019 데이터 이동 &amp; 접근성</text>
  <text x="1250" y="507" text-anchor="middle" class="text-sub-id">SCR-019 (VC-13 여울 WCAG)</text>

  <!-- Footer Node -->
  <rect x="50" y="650" width="1300" height="52" fill="#f4f0eb" stroke="#9e7b66" stroke-width="1.5" rx="6px" />
  <text x="700" y="681" text-anchor="middle" fill="#1e2522" font-family="Pretendard" font-size="14px" font-weight="700">전역 푸터: PAGE-019 이동·보존·도움말 | PAGE-020 브랜드 소개 (기억의 서재) | PAGE-001 홈</text>
</svg>
