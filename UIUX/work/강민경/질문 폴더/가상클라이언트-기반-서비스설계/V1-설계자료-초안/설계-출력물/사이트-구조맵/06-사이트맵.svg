<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">VC-002 기반 사이트맵</title>
  <desc id="desc">홈에서 기록 방식, 디지털 기록, 기록 가이드, 브랜드 소개로 이어지는 12개 페이지의 계층도</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#101828" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 42px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#172B4D}
      .subtitle{font:400 18px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#667085}
      .id{font:700 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:.6px}
      .name{font:700 22px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
      .depth{font:500 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
      .status{font:700 12px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;letter-spacing:.4px}
      .legend{font:500 14px 'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;fill:#475467}
      .line{fill:none;stroke:#98A2B3;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .lineConditional{fill:none;stroke:#D97706;stroke-width:3;stroke-dasharray:8 7;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#F7F8FC"/>
  <circle cx="1760" cy="60" r="240" fill="#E9F2FF" opacity=".75"/>
  <circle cx="100" cy="1020" r="260" fill="#EEF8F2" opacity=".8"/>

  <text x="90" y="78" class="title">VC-002 기반 사이트맵</text>
  <text x="90" y="116" class="subtitle">미래 일정·시간 흐름 통제 발주형 · 12 Pages · 최대 3Depth · 웹/모바일</text>

  <!-- connectors: HOME to 1Depth -->
  <path class="line" d="M960 242 V282 H270 V328"/>
  <path class="line" d="M960 282 H735 V328"/>
  <path class="line" d="M960 282 H1200 V328"/>
  <path class="line" d="M960 282 H1650 V328"/>

  <!-- connectors: 1Depth to 2Depth -->
  <path class="line" d="M270 426 V493"/>
  <path class="line" d="M735 426 V493"/>
  <path class="line" d="M1200 426 V465 H1075 V493"/>
  <path class="line" d="M1200 465 H1345 V493"/>
  <path class="line" d="M1200 465 H1630 V493"/>

  <!-- connectors: schedule to 3Depth -->
  <path class="line" d="M735 591 V650 H625 V680"/>
  <path class="lineConditional" d="M735 650 H845 V680"/>

  <!-- HOME -->
  <g filter="url(#shadow)">
    <rect x="760" y="148" width="400" height="94" rx="20" fill="#172B4D"/>
    <text x="790" y="181" class="id" fill="#A9C7FF">PAGE-001 · 0DEPTH</text>
    <text x="790" y="216" class="name" fill="#FFFFFF">HOME</text>
    <rect x="1020" y="174" width="110" height="30" rx="15" fill="#2E4A75"/>
    <text x="1075" y="194" class="status" fill="#FFFFFF" text-anchor="middle">CORE</text>
  </g>

  <!-- 1Depth -->
  <g filter="url(#shadow)">
    <rect x="90" y="328" width="360" height="98" rx="18" fill="#FFFFFF" stroke="#4C7FE5" stroke-width="3"/>
    <text x="118" y="362" class="id" fill="#3565C5">PAGE-002 · 1DEPTH</text>
    <text x="118" y="398" class="name" fill="#172B4D">기록 방식</text>
    <rect x="338" y="350" width="86" height="28" rx="14" fill="#E9F2FF"/><text x="381" y="369" class="status" fill="#3565C5" text-anchor="middle">CORE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="555" y="328" width="360" height="98" rx="18" fill="#FFFFFF" stroke="#4C7FE5" stroke-width="3"/>
    <text x="583" y="362" class="id" fill="#3565C5">PAGE-004 · 1DEPTH</text>
    <text x="583" y="398" class="name" fill="#172B4D">디지털 기록</text>
    <rect x="803" y="350" width="86" height="28" rx="14" fill="#E9F2FF"/><text x="846" y="369" class="status" fill="#3565C5" text-anchor="middle">CORE</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1020" y="328" width="360" height="98" rx="18" fill="#FFFFFF" stroke="#55A679" stroke-width="3"/>
    <text x="1048" y="362" class="id" fill="#28754B">PAGE-008 · 1DEPTH</text>
    <text x="1048" y="398" class="name" fill="#172B4D">기록 가이드</text>
    <rect x="1252" y="350" width="102" height="28" rx="14" fill="#E8F6EE"/><text x="1303" y="369" class="status" fill="#28754B" text-anchor="middle">SUPPORT</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1470" y="328" width="360" height="98" rx="18" fill="#FFFFFF" stroke="#7A6FD0" stroke-width="3"/>
    <text x="1498" y="362" class="id" fill="#5D50B7">PAGE-012 · 1DEPTH</text>
    <text x="1498" y="398" class="name" fill="#172B4D">브랜드 소개</text>
    <rect x="1702" y="350" width="102" height="28" rx="14" fill="#F0EDFF"/><text x="1753" y="369" class="status" fill="#5D50B7" text-anchor="middle">REQUIRED</text>
  </g>

  <!-- 2Depth -->
  <g filter="url(#shadow)">
    <rect x="90" y="493" width="360" height="98" rx="18" fill="#EDF4FF" stroke="#85A9F1" stroke-width="2"/>
    <text x="118" y="527" class="id" fill="#3565C5">PAGE-003 · 2DEPTH</text>
    <text x="118" y="563" class="name" fill="#172B4D">기록 스타일 찾기</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="555" y="493" width="360" height="98" rx="18" fill="#EDF4FF" stroke="#85A9F1" stroke-width="2"/>
    <text x="583" y="527" class="id" fill="#3565C5">PAGE-005 · 2DEPTH</text>
    <text x="583" y="563" class="name" fill="#172B4D">일정 관리</text>
    <rect x="785" y="515" width="104" height="28" rx="14" fill="#DCEAFF"/><text x="837" y="534" class="status" fill="#3565C5" text-anchor="middle">REQUIRED</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="950" y="493" width="250" height="98" rx="18" fill="#EEF8F2" stroke="#8BC4A3" stroke-width="2"/>
    <text x="975" y="527" class="id" fill="#28754B">PAGE-009 · 2DEPTH</text>
    <text x="975" y="563" class="name" fill="#172B4D">디지털 기록 시작</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1220" y="493" width="250" height="98" rx="18" fill="#EEF8F2" stroke="#8BC4A3" stroke-width="2"/>
    <text x="1245" y="527" class="id" fill="#28754B">PAGE-010 · 2DEPTH</text>
    <text x="1245" y="563" class="name" fill="#172B4D">선택·비교 가이드</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1490" y="493" width="280" height="98" rx="18" fill="#EEF8F2" stroke="#8BC4A3" stroke-width="2"/>
    <text x="1515" y="527" class="id" fill="#28754B">PAGE-011 · 2DEPTH</text>
    <text x="1515" y="563" class="name" fill="#172B4D">도움말·제공 범위</text>
  </g>

  <!-- 3Depth -->
  <g filter="url(#shadow)">
    <rect x="465" y="680" width="320" height="98" rx="18" fill="#FFFFFF" stroke="#4C7FE5" stroke-width="2"/>
    <text x="493" y="714" class="id" fill="#3565C5">PAGE-006 · 3DEPTH</text>
    <text x="493" y="750" class="name" fill="#172B4D">시간 흐름</text>
    <rect x="657" y="702" width="102" height="28" rx="14" fill="#E9F2FF"/><text x="708" y="721" class="status" fill="#3565C5" text-anchor="middle">REQUIRED</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="805" y="680" width="320" height="98" rx="18" fill="#FFF9EB" stroke="#E6A23C" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="833" y="714" class="id" fill="#B76E00">PAGE-007 · 3DEPTH</text>
    <text x="833" y="750" class="name" fill="#172B4D">중요 일정 상기</text>
    <rect x="993" y="702" width="106" height="28" rx="14" fill="#FFF0C7"/><text x="1046" y="721" class="status" fill="#B76E00" text-anchor="middle">CONDITIONAL</text>
  </g>

  <!-- notes and legend -->
  <g transform="translate(90 870)">
    <rect width="1740" height="126" rx="20" fill="#FFFFFF" stroke="#D0D5DD"/>
    <text x="28" y="38" class="id" fill="#172B4D">STRUCTURE NOTES</text>
    <text x="28" y="72" class="legend">GNB 4개 · 최대 3Depth · 외부 일정 연동/검색/계정은 HOLD · 서비스 흐름 및 UI는 미포함</text>
    <g transform="translate(28 92)"><circle cx="7" cy="0" r="7" fill="#4C7FE5"/><text x="22" y="5" class="legend">Core / Required</text></g>
    <g transform="translate(220 92)"><circle cx="7" cy="0" r="7" fill="#55A679"/><text x="22" y="5" class="legend">Support</text></g>
    <g transform="translate(345 92)"><circle cx="7" cy="0" r="7" fill="#E6A23C"/><text x="22" y="5" class="legend">Conditional</text></g>
    <text x="1710" y="100" class="legend" text-anchor="end">USER_REVIEW_PENDING</text>
  </g>
</svg>
