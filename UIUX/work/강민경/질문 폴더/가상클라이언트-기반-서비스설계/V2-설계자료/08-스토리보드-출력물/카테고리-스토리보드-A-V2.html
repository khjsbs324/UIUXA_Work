<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f1eb;color:#202421}main{max-width:1120px;margin:auto;padding:28px}.hero{padding:42px 28px;background:#e4e6e1;border-radius:18px;margin-bottom:18px}.section{background:#fff;border:1px solid #d5d2ca;border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid #d5d2ca;border-radius:12px;padding:14px;min-height:80px;background:#fafafa}.rail{display:flex;gap:10px;overflow:auto}.rail .card{min-width:170px}.tag{display:inline-block;border:1px solid #aaa;border-radius:999px;padding:4px 9px;font-size:12px}.note{background:#262a27;color:#fff;border-radius:14px;padding:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero{padding:28px 18px}}</style><title>카테고리-스토리보드-A-V2</title></head><body><main><section class='hero'><span class='tag'>카테고리 ·  · V2</span><h1>시각적 Hero로 카테고리의 인상을 전달하고 상품군을 목적별로 분류한다</h1><p><b>흐름:</b> 포트폴리오 Hero→분류→비교</p></section><section class='section'><h2>Visual Layout</h2><p>Hero → 카테고리 필터 → 포트폴리오 카드 → 비교·탐색</p></section><section class='section'><h2>포트폴리오 분류</h2><div class='rail'><div class='card'>Bath</div><div class='card'>Care</div><div class='card'>Studio</div><div class='card'>Gift</div><div class='card'>Space</div></div></section><section class='note'>상태·접근성·추적 ID는 병합 전 연결검증에서 확인한다.</section></main></body></html>
