<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">VC-11 가람 사이트구조맵 C안</title><desc id="desc">제품 탐색에서 브랜드 원칙으로 역추적하는 흐름</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker></defs><rect width="1200" height="620" fill="#f8fafc"/><text x="40" y="52" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">VC-11 가람 · 제품에서 원칙으로 역추적형</text><g stroke="#334155" stroke-width="2" marker-end="url(#a)" fill="#dbeafe"><path d="M250 220 H440"/><path d="M610 220 H800"/><path d="M970 220 V390 H800"/><path d="M630 390 H440"/></g><g font-family="Arial" font-size="17" text-anchor="middle" fill="#0f172a" stroke="#1d4ed8" stroke-width="2"><rect x="80" y="180" width="170" height="80" rx="14"/><rect x="440" y="180" width="170" height="80" rx="14"/><rect x="800" y="180" width="170" height="80" rx="14"/><rect x="800" y="350" width="170" height="80" rx="14"/><rect x="440" y="350" width="170" height="80" rx="14"/></g><g font-family="Arial" font-size="17" text-anchor="middle" fill="#0f172a"><text x="165" y="228">상황 선택</text><text x="525" y="228">제품 카테고리</text><text x="885" y="228">제품 상세·비교</text><text x="885" y="398">원칙 연결</text><text x="525" y="398">브랜드 소개</text></g><text x="40" y="570" font-family="Arial" font-size="15" fill="#475569">결과 없음·필터 완화 · 이전 비교 복귀 · 근거·한계 확인</text></svg>
