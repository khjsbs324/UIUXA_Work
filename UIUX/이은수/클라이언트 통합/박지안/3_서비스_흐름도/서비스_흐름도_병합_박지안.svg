<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="flowStart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="flowStep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="flowEnd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadowFlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="500" y="45" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold">[사단(士團)] 박지안 클라이언트 최적 병합 서비스 흐름도 (Service Flowchart)</text>
  
  <rect x="50" y="80" width="240" height="50" rx="25" fill="url(#flowStart)" filter="url(#shadowFlow)"/>
  <text x="170" y="110" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">1. 지점 선택 &amp; 타임슬롯 예매</text>

  <path d="M 170 130 L 170 180" stroke="#64748b" stroke-width="2" fill="none"/>

  <rect x="50" y="180" width="240" height="50" rx="8" fill="url(#flowStep)" stroke="#10b981" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <text x="170" y="202" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">2. 장인 1:1 조향 클래스 팩</text>
  <text x="170" y="219" text-anchor="middle" fill="#94a3b8" font-size="11">3D 마패 용기 각인 수강 콤보</text>

  <path d="M 170 230 L 170 280" stroke="#64748b" stroke-width="2" fill="none"/>

  <rect x="50" y="280" width="240" height="50" rx="8" fill="url(#flowStep)" stroke="#10b981" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <text x="170" y="302" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">3. 모바일 QR 어사 패스 발급</text>

  <path d="M 170 330 L 170 380" stroke="#64748b" stroke-width="2" fill="none"/>

  <rect x="50" y="380" width="240" height="50" rx="8" fill="url(#flowStep)" stroke="#10b981" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <text x="170" y="402" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">4. 웰컴 디스커버리 팩 수령</text>

  <path d="M 170 430 L 170 480" stroke="#64748b" stroke-width="2" fill="none"/>

  <rect x="50" y="480" width="240" height="50" rx="8" fill="url(#flowStep)" stroke="#10b981" stroke-width="1.5" filter="url(#shadowFlow)"/>
  <text x="170" y="502" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">5. 화해 비건 성분 검증</text>

  <path d="M 290 505 L 420 505" stroke="#8b5cf6" stroke-width="2" fill="none"/>

  <rect x="420" y="480" width="280" height="50" rx="25" fill="url(#flowEnd)" filter="url(#shadowFlow)"/>
  <text x="560" y="502" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">6. 결제 승인 &amp; 예약 완료</text>
</svg>
