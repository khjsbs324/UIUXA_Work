                      - code [ref=f16e1108]: "<!doctype html><html lang=\"ko\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>SOAPHE — 오래 남는 온기</title><link rel=\"stylesheet\" href=\"common.css\"><style>.hero{min-height:760px;display:grid;grid-template-columns:5fr 7fr;border-bottom:1px solid var(--line)}.hero-copy{padding:90px max(32px,calc((100vw - var(--max))/2));padding-right:40px;display:flex;flex-direction:column;justify-content:space-between}.hero h1{font-size:clamp(70px,9vw,145px);line-height:.78;margin:0}.hero-copy p{max-width:430px}.hero-media{min-height:640px}.intro{display:grid;grid-template-columns:3fr 8fr 1fr}.intro p{grid-column:2;font:clamp(34px,4.2vw,66px)/1.12 Georgia,serif;margin:0}.finder{background:#dfe1d7}.finder-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.finder label{font-size:12px}.finder select{display:block;width:100%;margin-top:8px;padding:14px;background:transparent;border:1px solid}.feature{display:grid;grid-template-columns:7fr 5fr;min-height:620px}.feature-copy{padding:90px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--cream)}.feature-copy h2{font-size:clamp(46px,6vw,92px);line-height:.9;margin:15px 0}.feature-image{min-height:500px}.ticker{padding:20px 0;white-space:nowrap;overflow:hidden;font:24px Georgia,serif;letter-spacing:.06em}.newsletter{display:grid;grid-template-columns:7fr 5fr;gap:50px;align-items:end}.newsletter h2{font-size:clamp(48px,7vw,105px);line-height:.85;margin:0}.newsletter form{display:grid;gap:12px}.newsletter input{padding:15px;background:transparent;border:0;border-bottom:1px solid}@media(max-width:800px){.hero,.feature,.newsletter{grid-template-columns:1fr}.hero-copy{padding:70px 24px;min-height:520px}.intro{display:block}.finder-grid{grid-template-columns:1fr 1fr}.feature-copy{padding:60px 24px}}</style></head><body><a class=\"skip\" href=\"#main\">본문 바로가기</a><header class=\"top\"><div class=\"wrap\"><a class=\"brand\" href=\"메인페이지_스토리보드.html\">SOAPHE</a><nav class=\"nav\" aria-label=\"주요 메뉴\"><a href=\"#new\">NEW FORMS</a><a href=\"#space\">SPACE EDIT</a><a href=\"#gift\">GIFT NOTES</a><a href=\"브랜드소개페이지_스토리보드.html\">OUR STORY</a></nav><div class=\"tools\"><a class=\"pill\" href=\"카테고리페이지_스토리보드.html\">ALL 15</a><a class=\"pill dark\" href=\"#finder\">FIND YOURS</a></div></div></header><main id=\"main\"><section class=\"hero\"><div class=\"hero-copy\"><span class=\"eyebrow\">Soap in the air · Object in your life</span><h1 class=\"serif\">WHAT<br>STAYS.</h1><div><p>비누를 띄워 더 잘 마르게 하고, 비누가 사라진 뒤에도 공간에 남는 오브제.</p><a class=\"plain dark\" href=\"#new\">15개 형태 만나보기</a></div></div><div class=\"hero-media hero-photo\" role=\"img\" aria-label=\"공중에 떠 있는 SOAPHE 비누와 오브제\"></div></section><section class=\"section\"><div class=\"wrap intro\"><span class=\"eyebrow\">Our proposition</span><p>사라지는 비누와 오래 남는 오브제 사이, SOAPHE는 씻는 시간 이후의 쓰임까지 디자인합니다.</p></div></section><section class=\"section finder\" id=\"finder\"><div class=\"wrap\"><div class=\"section-head\"><div><span class=\"eyebrow\">Quick finder</span><h2 class=\"serif\">당신의 장면부터<br>골라보세요.</h2></div><p>엔코스 라이브러리의 목적별 탐색 방식을 참고해 공간, 향, 소재, 선물 목적을 먼저 고릅니다.</p></div><div class=\"finder-grid\"><label>공간<select id=\"space\"><option>욕실</option><option>현관</option><option>책상</option></select></label><label>향<select id=\"scent\"><option>무향</option><option>포근한 향</option><option>허브 향</option></select></label><label>소재<select id=\"material\"><option>Stone</option><option>Porcelain</option><option>Glass</option></select></label><label>목적<select id=\"purpose\"><option>나를 위한 선택</option><option>집들이 선물</option><option>감사 선물</option></select></label></div><p class=\"status\" id=\"recommend\" aria-live=\"polite\">추천: ARCH SET · 접점은 줄이고 온기는 오래 남기는 시그니처 구성</p><button class=\"plain dark\" id=\"recommendBtn\">추천 갱신</button></div></section><section class=\"section\" id=\"new\"><div class=\"wrap\"><div class=\"section-head\"><div><span class=\"eyebrow\">01 · New forms</span><h2 class=\"serif\">새롭게 놓이는 형태</h2></div><p>첫인상이 선명한 신규 오브제와 세트를 큰 리듬으로 배치했습니다.</p></div><div class=\"product-row\" data-group=\"new\"></div></div></section><section class=\"feature\"><div class=\"feature-image tray-photo\" role=\"img\" aria-label=\"책상 위 라이프스타일 트레이로 쓰이는 SOAPHE 오브제\"></div><div class=\"feature-copy\"><span class=\"eyebrow\">Second life</span><h2 class=\"serif\">BATH<br>TO DESK.</h2><p>욕실에서 비누를 받치던 형태는 책상 위에서 열쇠와 주얼리, 작은 기억을 받아냅니다.</p><a href=\"브랜드소개페이지_스토리보드.html\">쓰임의 여정 보기 →</a></div></section><section class=\"section\" id=\"space\"><div class=\"wrap\"><div class=\"section-head\"><div><span class=\"eyebrow\">02 · Space essentials</span><h2 class=\"serif\">공간이 고른 오브제</h2></div><p>욕실·현관·책상의 크기와 빛에 자연스럽게 어울리는 다섯 가지 형태.</p></div><div class=\"product-row\" data-group=\"space\"></div></div></section><div class=\"ticker\">AIR BETWEEN · LESS CONTACT · LONGER USE · SECOND LIFE · AIR BETWEEN · LESS CONTACT · LONGER USE</div><section class=\"section\" id=\"gift\"><div class=\"wrap\"><div class=\"section-head\"><div><span class=\"eyebrow\">03 · Gift notes</span><h2 class=\"serif\">온기를 건네는 구성</h2></div><p>향과 메시지를 함께 고를 수 있는 다섯 가지 선물 및 리필 구성.</p></div><div class=\"product-row\" data-group=\"gift\"></div></div></section><section class=\"section\"><div class=\"wrap newsletter\"><h2 class=\"serif\">A NOTE<br>THAT STAYS.</h2><form id=\"news\"><label>새 컬렉션 소식 받기<input type=\"email\" required placeholder=\"email@example.com\"></label><button class=\"plain dark\">구독하기</button><div id=\"newsStatus\" aria-live=\"polite\"></div></form></div></section></main><footer class=\"footer\"><div class=\"wrap\"><b>SOAPHE</b><span>오래 남는 온기를 선물하다.</span><span>© 2026 SOAPHE</span></div></footer><script> const products={new:[['01','ARCH SET','Stone · warm soap','48,000원'],['02','HALO SET','Glass · soft soap','52,000원'],['03','FOLD SET','Porcelain · zero soap','46,000원'],['04','ORBIT SET','Glass · herb soap','56,000원'],['05','COVE SET','Porcelain · warm soap','45,000원']],space:[['06','ARCH OBJECT','Wide bath · Stone','33,000원'],['07','FOLD OBJECT','Desk · Porcelain','31,000원'],['08','HALO OBJECT','Entry · Glass','36,000원'],['09','PLINTH OBJECT','Wide bath · Stone','35,000원'],['10','COVE OBJECT','Small bath · Porcelain','29,000원']],gift:[['11','ZERO BAR DUO','Unscented · 2 bars','32,000원'],['12','SOFT BAR DUO','Soft scent · 2 bars','35,000원'],['13','HERB BAR DUO','Herb scent · 2 bars','38,000원'],['14','WARM REFILL','Warm scent · 3 bars','45,000원'],['15','SEASON NOTE','Limited scent · gift','58,000원']]};document.querySelectorAll('[data-group]').forEach(row=>{row.innerHTML=products[row.dataset.group].map(p=>`<article class=\"product\"><div class=\"visual\" role=\"img\" aria-label=\"${p[1]} 제품 이미지 자리\"></div><div class=\"meta\"><span>${p[0]}</span><span>${p[3]}</span></div><h3>${p[1]}</h3><small>${p[2]}</small><br><button onclick=\"location.href='카테고리페이지_스토리보드.html#${p[0]}'\">제품 보기 +</button></article>`).join('')});recommendBtn.onclick=()=>recommend.textContent=`추천: ${space.value==='책상'?'FOLD OBJECT':space.value==='현관'?'HALO OBJECT':'ARCH SET'} · ${space.value}과 ${material.value}, ${scent.value} 조건을 반영했습니다.`;news.onsubmit=e=>{e.preventDefault();newsStatus.textContent='구독 신청이 완료되었습니다.'}</script></body></html>"
