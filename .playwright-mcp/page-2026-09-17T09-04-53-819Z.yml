rder:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:left}.card h3{margin:7px 0}.visual{height:140px;border-radius:12px;background:repeating-linear-gradient(135deg,#d4d1c9 0 8px,#ebe8e0 8px 16px);display:grid;place-items:center;font-weight:800}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chips button{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 13px}.chips button.active{background:var(--ink);color:#fff}.muted{color:var(--muted)}.dark{background:var(--dark);color:#fff}.dark .muted{color:#c9ceca}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #999;border-radius:10px;background:#fff}.status{background:#eee;padding:11px;border-radius:10px;margin:12px 0}.status.good{background:#dfe9e2}.status.error{background:#f0d8d8}.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin:8px 0}.modal{display:none;position:fixed;inset:0;z-index:30;background:#0009;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(540px,100%);background:#fff;border-radius:22px;padding:25px}.close{float:right;border:0;background:transparent;font-size:1.5rem}.footer{padding:40px 0;color:var(--muted)}.product[hidden],.story[hidden]{display:none}.timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{font-size:2rem;font-weight:900}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8b8b8b;outline-offset:3px}@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:40px}.grid{grid-template-columns:1fr}.timeline{grid-template-columns:1fr}.links a:not(:last-child){display:none}.object{max-width:420px;margin:auto}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style></head><body><header class=\"top\"><nav class=\"wrap\"><span class=\"brand\">SOAPHE Unified</span><div class=\"links\"><a href=\"#story\">Story</a><a href=\"#collection\">Collection</a><a href=\"#proof\">Proof</a><a class=\"btn primary\" href=\"#contact\">내 목적 찾기</a></div></nav></header><main><section><div class=\"wrap hero\"><div><span class=\"tag\">INTERACTIVE WIREFRAME · HOME</span><h1>열 가지 목적을 연결하는 통합 경험<br>일상에 오래 남도록.</h1><p class=\"lead\">기능, 공간, 선물과 순환의 경험을 한 흐름에서 확인하고 나에게 맞는 다음 행동을 선택하세요.</p><p><a class=\"btn primary\" href=\"#collection\">컬렉션 보기</a> <a class=\"btn\" href=\"#proof\">근거 확인</a></p></div><div class=\"object\" role=\"img\" aria-label=\"회색 SOAPHE 오브젝트 제품 이미지 자리\">360° OBJECT<br>HOVER</div></div></section><section id=\"story\"><div class=\"wrap\"><span class=\"tag\">01 · PROBLEM & SOLUTION</span><h2>사용의 불편에서 시작했습니다</h2><div class=\"grid\"><article class=\"card\"><h3>물러지는 비누</h3><p>물 고임과 잔여물로 관리가 복잡해집니다.</p></article><article class=\"card\"><h3>공간과 맞지 않는 도구</h3><p>기능만 남은 받침대가 공간의 인상을 해칩니다.</p></article><article class=\"card\"><h3>SOAPHE의 제안</h3><p>열 가지 목적을 연결하는 통합 경험을 중심으로 쓰임과 선택 과정을 다시 설계합니다.</p></article></div></div></section><section id=\"collection\"><div class=\"wrap\"><span class=\"tag\">02 · COLLECTION</span><h2>목적에 맞는 구성을 선택하세요</h2><div class=\"chips\" id=\"tabs\"><button class=\"active\" data-k=\"all\">전체</button><button data-k=\"daily\">일상</button><button data-k=\"gift\">선물</button><button data-k=\"space\">공간</button></div><div class=\"grid\"><article class=\"card product\" data-k=\"daily\"><div class=\"visual\">DAILY</div><h3>Daily Ritual</h3><p>매일 사용하기 좋은 기본 구성</p></article><article class=\"card product\" data-k=\"gift\"><div class=\"visual\">GIFT</div><h3>Meaningful Gift</h3><p>메시지와 포장을 함께 구성</p></article><article class=\"card product\" data-k=\"space\"><div class=\"visual\">SPACE</div><h3>Space Object</h3><p>욕실에서 책상까지 이어지는 쓰임</p></article></div></div></section><section id=\"proof\"><div class=\"wrap\"><span class=\"tag\">03 · PROCESS & PROOF</span><h2>확인 가능한 정보만 말합니다</h2><div class=\"timeline\"><article class=\"card\"><b>01</b><p>원료 확인</p></article><article class=\"card\"><b>02</b><p>제작</p></article><article class=\"card\"><b>03</b><p>검수</p></article><article class=\"card\"><b>04</b><p>포장</p></article><article class=\"card\"><b>05</b><p>사용 이후</p></article></div><p class=\"status\">검증 완료 · 검증 진행 · 자료 준비 중을 구분해 표시합니다.</p></div></section><section><div class=\"wrap faq\"><span class=\"tag\">04 · FAQ</span><h2>자주 묻는 질문</h2><details><summary>여기서 바로 결제할 수 있나요?</summary><p>현재 와이어프레임의 전환 범위는 상담·샘플·알림 접수까지입니다.</p></details><details><summary>환경 효과는 어떻게 확인하나요?</summary><p>정량 자료가 확인된 경우에만 출처와 함께 표시합니다.</p></details></div></section><section id=\"contact\" class=\"dark\"><div class=\"wrap\"><span class=\"tag\">05 · CONTACT</span><h2>내 목적 찾기</h2><form id=\"form\" class=\"card\" novalidate><label class=\"field\">이름<input name=\"name\" required></label><label class=\"field\">연락처<input name=\"contact\" required></label><label><input type=\"checkbox\" name=\"ok\"> 개인정보 수집 동의</label><p><button class=\"btn primary\">신청하기</button></p><div id=\"status\" class=\"status\">필수 정보를 입력해 주세요.</div></form></div></section></main><div id=\"done\" class=\"modal\" role=\"dialog\" aria-modal=\"true\"><div class=\"dialog\"><button class=\"close\" aria-label=\"닫기\">×</button><h2>신청 완료</h2><p>입력하신 목적에 맞춰 다음 절차를 안내합니다.</p></div></div><footer class=\"wrap footer\">SOAPHE Unified · Visual Storyboard Prototype</footer><script>document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.product').forEach(x=>x.hidden=b.dataset.k!=='all'&&x.dataset.k!==b.dataset.k)});const f=document.querySelector('#form');f.onsubmit=e=>{e.preventDefault();const s=document.querySelector('#status');if(!f.name.value.trim()||f.contact.value.trim().length<5||!f.ok.checked){s.className='status error';s.textContent='이름, 연락처, 개인정보 동의를 확인해 주세요.';return}s.className='status good';s.textContent='입력 확인 완료';document.querySelector('#done').classList.add('open')};document.querySelector('.close').onclick=()=>document.querySelector('#done').classList.remove('open');</script></body></html>"
