ay:grid;grid-template-columns:7fr 5fr;gap:42px}.stage{height:500px;border:1px solid}.controls{align-self:end}.controls input{width:100%}.index{display:grid;grid-template-columns:5fr 3fr 4fr;gap:18px}.tile{border-top:1px solid;padding-top:12px}.tile div{height:180px;background:#ddd;margin:18px 0}.materials{display:grid;grid-template-columns:4fr 3fr 5fr;gap:18px;align-items:end}.mat{border:1px solid;padding:20px}.mat:nth-child(1){height:260px}.mat:nth-child(2){height:390px}.mat:nth-child(3){height:320px}.diagram{height:380px;border:1px solid;background:repeating-linear-gradient(0deg,#fff,#fff 39px,#ddd 40px)}form{display:grid;gap:12px}form input,form select{width:100%;padding:12px}.status{border:2px dashed #555;padding:15px}.faq button{width:100%;text-align:left;border-width:1px 0 0;padding:18px 0}.answer{display:none;padding:0 0 20px}.footer{padding:55px 36px;background:#111;color:#fff;display:flex;justify-content:space-between}@media(max-width:1000px){.finder{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){nav{display:none}.hero,.study,.proof,.reserve{grid-template-columns:1fr}.scene{min-height:500px}section{padding:70px 18px}.manifesto{display:block}.manifesto p{font-size:32px}.index,.materials,.finder{grid-template-columns:1fr}.mat:nth-child(n){height:240px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.shadow{filter:none;transform:none!important}} </style></head><body><a class=\"skip\" href=\"#main\">본문 바로가기</a><header><b>SOAPHE / 05</b><nav aria-label=\"주요 메뉴\"><a href=\"#finder\">FINDER</a><a href=\"#light\">DISCOVER</a><a href=\"#forms\">COLLECTION</a><a href=\"브랜드소개페이지_스토리보드.html\">STORY</a></nav><button onclick=\"go('preview')\">PREVIEW</button></header><main id=\"main\"> <div class=\"hero\"><div class=\"copy\"><span class=\"cap\">HM-01 · EDITORIAL HOME</span><h1 class=\"serif\">WHAT<br>REMAINS<br>IN SPACE.</h1><div><button onclick=\"go('light')\">빛 탐색</button> <button onclick=\"go('forms')\">16개 형태</button></div></div><div class=\"scene\"><div class=\"shadow\"></div><div class=\"obj\"></div></div></div> <section class=\"manifesto\"><span class=\"cap\">SCR-120 · MANIFESTO</span><p>비누는 사라지지만 형태는 남습니다. SOAPHE는 건조의 구조를 공간의 오브제로 바꿉니다.</p></section> <section id=\"finder\"><span class=\"cap\">SCR-140 · QUICK FINDER</span><h2 class=\"serif\">네 가지 조건으로 먼저 좁혀보세요.</h2><div class=\"finder\"><label>예산<select id=\"budget\"><option>3만원 이하</option><option>5만원 이하</option><option>제한 없음</option></select></label><label>향<select id=\"scent\"><option>0 무향</option><option>1 미향</option><option>2 은은함</option></select></label><label>공간<select id=\"space\"><option>작은 세면대</option><option>넓은 욕실</option><option>책상·선반</option></select></label><label>관리<select id=\"care\"><option>주 1회</option><option>주 2회</option><option>간편 관리</option></select></label></div><p id=\"finderResult\" class=\"status\" aria-live=\"polite\">현재 조건에 맞는 추천 3개를 확인할 수 있습니다.</p><button id=\"findButton\">추천 갱신</button> <button id=\"resetFinder\">조건 초기화</button></section>"
